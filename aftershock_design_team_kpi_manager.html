<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>AFTERSHOCK | Design Team KPI Manager</title>
<style>
:root{--bg:#090d13;--panel:#121921;--line:#283340;--line2:#364251;--text:#e9eff7;--muted:#8f9fb2;--sub:#65778c;--red:#ef4053;--orange:#ff974e;--green:#48d5a0;--blue:#7aaefc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:#232e3b;color:var(--text);padding:9px 12px;border-radius:8px}
button:hover{background:#324153}
button.primary{background:#e34153;border-color:#e34153;color:white}
button.danger{color:#ff8a95}
button.small{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;background:#0e151d;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:85px;resize:vertical}
input[type=date]{color-scheme:dark}
.app{display:grid;grid-template-columns:clamp(210px,17vw,320px) minmax(0,1fr);min-height:100vh}
.sidebar{background:#10161e;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line)}
.brand strong{font-size:17px;letter-spacing:1px}
.brand strong span{color:var(--red)}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.8px;margin-bottom:7px}
.weekbox{padding:0 7px}
.weekbox input,.weekbox select{margin-bottom:8px}
.nav{display:grid;gap:5px}
.nav button{display:flex;align-items:center;text-align:left;gap:10px;background:transparent;border-color:transparent;padding:10px}
.nav button.active{background:#261e27;border-color:#6d3340}
.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;flex-shrink:0;font-weight:800}
.navtext{min-width:0;flex:1}
.navtext strong{display:block}
.navtext small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere;color:var(--sub);font-size:11px}
.navcount{color:var(--muted);font-size:11px}
.main{padding:26px 30px 60px;min-width:0;max-width:1800px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:1px}
h1{font-size:24px;margin:3px 0 5px}
h2{font-size:21px;margin:0}
h3{font-size:16px;margin:0}
p{margin:4px 0}
.muted{color:var(--muted);font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);display:flex;flex-direction:column;gap:4px;min-width:190px;background:#fff;border:1px solid #e1e5eb;border-radius:10px;padding:7px;box-shadow:0 16px 44px rgba(16,24,38,.18);z-index:25}
.menu[hidden]{display:none}
.menu button{background:transparent;border-color:transparent;color:#18212f;text-align:left;padding:9px 12px;font-weight:600}
.menu button:hover{background:#f2f4f7}
.menu-sep{height:1px;background:#e1e5eb;margin:4px 6px}
.menu button.danger{color:#c0392b}
.menu button.danger:hover{background:#fdecea}
body.compact #personView .detail-card{display:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:17px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:14px}
.stat{margin:0;background:linear-gradient(150deg,#18212d,#121921)}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:26px;margin-top:4px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.sectionhead p{font-size:12px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .avatar{width:58px;height:58px;font-size:20px}
.hero .info{flex:1;min-width:180px}
.hero .desc{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;color:#b7c8d9;background:#1b2835;white-space:nowrap}
.good{color:#73e6b4;background:#16332a;border-color:#2c6150}
.warn{color:#ffd087;background:#3b2a1b;border-color:#684a30}
.bad{color:#ff9ba7;background:#3d2029;border-color:#6b3440}
.neutral{color:#b7c5d7;background:#222b38}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:#9faec1;font-weight:600}
.field.wide{grid-column:1/-1}
.metric{border:1px solid var(--line);border-radius:10px;background:#151f2a;margin-bottom:8px;overflow:hidden}
.metric summary{display:grid;grid-template-columns:minmax(0,1.7fr) 110px 100px 90px;gap:10px;align-items:center;padding:12px;cursor:pointer;list-style:none}
.metric summary::-webkit-details-marker,.record summary::-webkit-details-marker{display:none}
.metric summary:hover,.record summary:hover{background:#202c3a}
.metricname{font-weight:700;overflow-wrap:anywhere}
.metricbody{padding:14px;border-top:1px solid var(--line);background:#111923}
.record{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#151e29;overflow:hidden}
.record summary{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;list-style:none}
.recordtitle{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.recordbody{padding:14px;border-top:1px solid var(--line);background:#111922}
.placeholder{padding:22px;border:1px dashed var(--line2);border-radius:10px;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#17202b;color:var(--muted)}
tr[data-person]{cursor:pointer}
tr[data-person]:hover td{background:#202c3a}
.note{font-size:12px;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.note summary{cursor:pointer;color:#e9eff7;font-weight:600}
.note ul{margin:8px 0 2px;padding-left:18px;line-height:1.75}
.note li{margin:2px 0}
.progress{height:6px;border-radius:20px;background:#303d4e;overflow:hidden;margin:12px 0}
.progress span{height:100%;display:block;background:var(--green)}
.toast{position:fixed;right:20px;bottom:20px;background:#274335;border:1px solid #3e7258;color:#b5f0cd;padding:12px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
button.ghost{background:#eef1f5;color:#33404f}
button.ghost:hover{background:#e4e9ef}
.modal{position:fixed;inset:0;background:rgba(16,24,38,.45);display:none;z-index:30;padding:24px;overflow:auto}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;width:min(760px,100%);margin:auto;padding:20px;box-shadow:0 20px 60px rgba(16,24,38,.25)}
.modal-box h3{margin:0 0 6px;font-size:16px}
.modal-box p{margin:0 0 12px;color:#6c7888;font-size:13px;line-height:1.65}
.modal-box textarea{width:100%;height:300px;font:12px/1.6 Consolas,Monaco,monospace;border:1px solid #e1e5eb;border-radius:9px;padding:10px;resize:vertical;color:#18212f;background:#fff}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
@media (max-width:700px){.modal{padding:12px}.modal-box{padding:14px}.modal-box textarea{height:240px}.modal-actions button{flex:1 1 auto}}
.toast.show{opacity:1}
footer{color:var(--sub);font-size:11px;margin-top:20px}
/* 成员填写页 */
.fill{max-width:760px;margin:0 auto;padding:20px 14px 110px}
.fill-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fill h1{font-size:20px;margin:0}
.fill .muted{font-size:12px}
.kpi-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kpi-row:last-child{border-bottom:0}
.kpi-row span:last-child{color:var(--muted);white-space:nowrap}
.fillitem{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;background:#151f2a}
.fillitem .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.fillitem .row.two{grid-template-columns:1fr 1fr;margin-top:8px}
.fillitem .row.three{grid-template-columns:1fr 1fr 1fr;margin-top:8px}
.fillitem textarea{min-height:62px;margin-top:8px}
.fillitem label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.fillitem .del{color:#ff8a95}
.fillbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px;background:#0d141d;border-top:1px solid var(--line);z-index:30}
.fillbar button{flex:1}
.fillbar .ghost{flex:0 0 110px}
.invite-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4;color:#18212f}
.invite-row:last-child{border-bottom:0}
.invite-row .who{flex:1;min-width:0}
.invite-row strong{display:block;font-size:13px}
.invite-row small{color:#6c7888;font-size:11px}
.invite-row .linkbox{display:block;width:100%;height:46px;margin-top:6px;padding:6px 8px;font:10.5px/1.45 Consolas,Monaco,monospace;color:#4a5666;background:#f7f9fb;border:1px solid #e1e5eb;border-radius:6px;resize:none;word-break:break-all;cursor:text}
.invite-row .linkbox:focus{border-color:#7aaefc;outline:none}
.top-badge{display:inline-block;margin-left:6px;font-size:10px;color:#2f9e72;font-weight:700}
@media(max-width:700px){.fillitem .row.three{grid-template-columns:1fr 1fr}.fillbar .ghost{flex:0 0 92px}}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.main{padding:20px 15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 body{font-size:13.5px}
 .app{display:block}
 .sidebar{position:static;height:auto;padding:10px 10px 8px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:2px 4px 9px}
 .brand strong{font-size:15px}
 .brand small{font-size:9px;margin-top:3px}
 .weekbox{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
 .weekbox .label{grid-column:1/-1;margin-bottom:0}
 .weekbox input,.weekbox select{margin:0}
 #newWeek{grid-column:1/-1}
 .weekbox p.muted{grid-column:1/-1;margin:0;font-size:11px}
 .nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 .nav button{padding:7px 8px;gap:8px}
 .avatar{width:26px;height:26px;font-size:11px}
 .navtext strong{font-size:12.5px}
 .navtext small{font-size:10px}
 .navcount{font-size:10px}
 .main{padding:14px 10px 40px}
 .top{margin-bottom:14px;gap:8px}
 h1{font-size:20px}
 h2{font-size:17px}
 h3{font-size:15px}
 .sectionhead{margin-bottom:10px}
 .card{padding:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}
 .stat{padding:11px}
 .stat strong{font-size:20px}
 .grid{grid-template-columns:1fr}
 .field.wide{grid-column:auto}
 input,select,textarea{font-size:16px;padding:9px}
 textarea{min-height:76px}
 button{font-size:13px}
 .hero .avatar{width:46px;height:46px;font-size:16px}
 .hero .info{min-width:0}
 .pills{gap:5px}
 .pill{font-size:10px;padding:3px 7px}
 .metric summary{grid-template-columns:minmax(0,1fr) 62px 58px;gap:6px;padding:10px;font-size:11px}
 .metric summary .pill{display:none}
 .metricbody{padding:10px}
 .record summary{padding:10px;flex-wrap:wrap;row-gap:4px}
 .recordbody{padding:10px}
 th,td{padding:8px;font-size:11px}
 .toast{left:12px;right:12px;bottom:12px;text-align:center}
 .actions{width:100%}
 .actions button{flex:1}
 footer{margin-top:14px}
}
@media print{body{background:white;color:#111}.sidebar,.actions,button{display:none!important}.app{display:block}.main{padding:0}.card,.stat,.record,.metric{background:white;color:#111;box-shadow:none;border-color:#ddd}.metricbody,.recordbody{background:white}.muted,.field label{color:#444}input,select,textarea{background:white;color:#111;border-color:#ddd}.metric,.record{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <strong>AFTER<span>SHOCK</span></strong>
    <small>DESIGN TEAM · KPI MANAGEMENT</small>
  </div>
  <div class="weekbox">
    <div class="label">REPORTING WEEK</div>
    <input type="date" id="weekInput" aria-label="选择周次">
    <select id="weekSelect" aria-label="历史周报"></select>
    <button id="newWeek" class="primary" style="width:100%">＋ 新建周报</button>
    <p class="muted">新建周报会清空所有填写内容，KPI 只保留指标、清空实际值。</p>
  </div>
  <div>
    <div class="label">TEAM MEMBERS</div>
    <nav class="nav" id="memberNav"></nav>
  </div>
  <div class="muted" id="saveStatus">本地自动保存</div>
</aside>
<main class="main">
  <header class="top">
    <div>
      <div class="eyebrow">DESIGN PERFORMANCE MANAGEMENT</div>
      <h1 id="pageTitle">设计团队 KPI 与周任务管理</h1>
      <div class="muted" id="periodText"></div>
    </div>
    <div class="actions">
      <button id="teamView" class="ghost">团队总览</button>
      <button id="addMember" class="ghost">＋ 成员</button>
      <button id="detailToggle" class="ghost">收起详情</button>
      <button id="moreBtn" class="ghost">⋯ 更多</button>
      <div class="menu" id="moreMenu" hidden>
        <button id="exportDoc">导出 Word 周报</button>
        <button id="exportHtml">导出网页报告</button>
        <button id="inviteMembers">邀请成员填写</button>
        <button id="receiveSubmit">接收成员提交</button>
        <button id="syncSubmissions">同步成员提交</button>
        <button id="printPage">打印 / PDF</button>
        <div class="menu-sep"></div>
        <button id="clearWeek" class="danger">清除本周数据</button>
      </div>
    </div>
  </header>
  <section class="stats" id="stats"></section>
  <section id="personView"></section>
  <section id="teamViewPanel" class="hidden"></section>
  <footer>数据会自动保存在当前浏览器中，不会同步到 ClickUp 或其他设备。</footer>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const STORAGE_KEY="aftershock_design_kpi_manager_v4";
const COLORS=["#f17b59","#487eff","#20c8a0","#26dcd3","#8fbdec","#e7bd64","#48aafa"];

const KPI_CONFIG_VERSION=3;
/* 统一的返工口径：只统计确认属于设计师责任的质量问题 */
const REWORK_RULE="只统计确认属于设计师责任的返工：未按已确认 Brief 执行、遗漏明确要求、拼写 / 排版 / 对齐等执行错误、图片精修质量不达已确认标准、产品视觉 / 颜色 / 结构处理错误、已指出的问题重复出现。更换文案 / 标题 / 副标题、更换产品 / SKU / 型号、修改价格与促销信息、需求方改变设计方向、上级要求进一步优化、原始素材质量不合格、等待上游资料、审核延迟、审核通过后新增要求，均不计入。责任无法确认时标记「待确认」，不计入返工。同一任务多次退回只计一次。";

/* 已确认的个人定制 KPI；目标值是建议标准，不代表实际成绩。 */
const PROFILES=[
{
 id:"zoran",name:"Zoran",role:"Design Team Lead / 设计组长",
 desc:"团队任务管理、重点项目推进、跨部门协调与交付管理",color:COLORS[0],
 kpis:[
 ["团队准时交付率",95,"%",37.5,"gte","以设计师首次提交进入审核的时间为准：截止日期前首次进入 Review 即视为按时提交。审核人员延迟反馈、审核后新增的文案 / 产品 / 素材 / 方向类要求，均不认定为团队逾期。无 Review 记录的任务不推断提交时间，标记待核实。"],
 ["重点项目里程碑达成率",90,"%",31.25,"gte","只统计 Zoran 本人负责并推进的重点项目里程碑。Joke 负责的 Lilith、Inarius、Diablo、Mephisto 等机箱设计属于其专项设计进度，不计入本项达成率。"],
 ["资源与跨部门阻碍处理率",90,"%",18.75,"gte","及时识别并推动解决资源冲突、需求不明确及跨部门依赖，降低问题对项目进度的影响。"],
 ["周报与项目状态准确率",100,"%",12.5,"gte","确保项目进度、交付状态、风险和 KPI 数据真实准确，为管理层决策提供可靠依据。无法取得真实数据时留空，不做估算。"]
 ]
},
{
 id:"wenmin",name:"Wenmin",role:"Marketing Graphic Designer / 营销平面设计",
 desc:"静态促销素材、Banner、KV、营销内容",color:COLORS[1],
 kpis:[
 ["设计任务准时交付率",95,"%",30,"gte","以首次提交进入审核的时间为准：截止日期前首次进入 Review 即视为按时交付。审核延迟反馈或审核后新增的文案 / 产品 / 素材 / 方向要求，不算逾期。无 Review 记录时不推断提交时间。"],
 ["首轮设计审核通过率",85,"%",25,"gte","提升对设计 Brief、品牌规范和视觉方向的理解，减少因设计方向偏差导致的重复修改。"],
 ["营销信息准确率",100,"%",25,"gte","确保广告中的价格、促销条件、产品信息及文案准确，避免信息错误影响营销活动。"],
 ["设计返工率",10,"%",20,"lte",REWORK_RULE]
 ]
},
{
 id:"joke",name:"Joke",role:"Creative / Concept Designer / 创意设计",
 desc:"创意概念、机箱设计、IP 系列视觉及原创设计",color:COLORS[3],
 kpis:[
 ["设计任务准时交付率",95,"%",30,"gte","以首次提交进入审核的时间为准：截止日期前首次进入 Review 即视为按时交付。审核延迟反馈或审核后新增的文案 / 产品 / 素材 / 方向要求，不算逾期。无 Review 记录时不推断提交时间。"],
 ["创意方向首轮审核通过率",80,"%",35,"gte","提升对创意 Brief、品牌定位和产品视觉方向的理解，减少因方向理解偏差导致的重复探索。"],
 ["设计返工率",10,"%",35,"lte",REWORK_RULE]
 ]
},
{
 id:"jason",name:"Jason",role:"Campaign / Brand Visual Designer / 品牌视觉设计",
 desc:"Campaign 主视觉、Banner、页面视觉、社媒及活动素材",color:COLORS[4],
 kpis:[
 ["设计任务准时交付率",95,"%",30,"gte","以首次提交进入审核的时间为准：截止日期前首次进入 Review 即视为按时交付。审核延迟反馈或审核后新增的文案 / 产品 / 素材 / 方向要求，不算逾期。无 Review 记录时不推断提交时间。"],
 ["首轮设计审核通过率",85,"%",35,"gte","提高对 Campaign Brief、品牌视觉方向及营销重点的理解，减少因未正确执行已确认方向而产生的重复修改。"],
 ["设计返工率",10,"%",35,"lte",REWORK_RULE]
 ]
},
{
 id:"henry",name:"Henry",role:"Product Visual Designer / 产品视觉设计",

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dateObj=s=>{const [y,m,d]=(s||todayISO()).split("-").map(Number);return new Date(y,m-1,d||1,12)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const monday=s=>{const d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const endOfWeek=s=>{const d=dateObj(s);d.setDate(d.getDate()+6);return iso(d)};
const nextWeek=s=>{const d=dateObj(s);d.setDate(d.getDate()+7);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>v===""||v==null||!Number.isFinite(Number(v))?null:Number(v);

function createKPI(x){
 return {id:uid(),name:x[0],target:x[1],unit:x[2],weight:x[3],op:x[4],comment:x[5]||"",actual:""};
}
/* 新建周报用的 KPI 模板：优先用成员当前的默认配置，其次回退到 PROFILES */
function kpiTemplateOf(m){
 const profile=PROFILES.find(x=>x.id===m.id);
 const list=(m.kpis&&m.kpis.length?m.kpis:profile?profile.kpis:[])||[];
 return list.map(x=>Array.isArray(x)?createKPI(x):{id:uid(),name:x.name||"新 KPI 指标",target:x.target??"",unit:x.unit||"%",weight:x.weight??0,op:x.op||"gte",comment:x.comment||"",actual:""});
}
function initialState(){
 const w=monday(todayISO()),people={};
 PROFILES.forEach(m=>people[m.id]={kpis:m.kpis.map(createKPI),tasks:[],blockers:[],plans:[]});
 return {version:5,kpiVersion:KPI_CONFIG_VERSION,members:PROFILES.map(m=>({...m,kpis:m.kpis.map(x=>[...x])})),activeWeek:w,selectedId:"zoran",weeks:{[w]:{people,teamNotes:"",createdAt:new Date().toISOString()}}};
}

let state;
try{
 state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 if(!state||!Array.isArray(state.members)||!state.weeks)state=initialState();
}catch(e){state=initialState();}

/* 迁移前先备份，备份只做一次 */
function backupBeforeMigration(fromVersion){
 const key=`${STORAGE_KEY}_backup_v${fromVersion}`;
 try{
  if(!localStorage.getItem(key))localStorage.setItem(key,JSON.stringify(state));
 }catch(e){}
}
/* 迁移逻辑说明：
   1. 先备份整份数据，再执行迁移；
   2. 历史周报的 KPI 名称 / 目标 / 单位 / 权重 / 实际值一律不改；
   3. 当前周直接套用新的 KPI 配置，同名指标保留已填实际值；
   4. 版本号写入 state，重复刷新不会重复迁移；
   5. 清理已下线的机箱专项字段。 */
function migrateKpis(){
 const from=Number(state.kpiVersion)||1;
 if(from>=KPI_CONFIG_VERSION){state.kpiVersion=KPI_CONFIG_VERSION;return false}
 backupBeforeMigration(from);

 PROFILES.forEach(profile=>{
  const member=state.members.find(m=>m.id===profile.id);
  if(!member){state.members.push({...profile,kpis:profile.kpis.map(x=>[...x])});return}
  Object.assign(member,{name:profile.name,role:profile.role,desc:profile.desc,color:profile.color,kpis:profile.kpis.map(x=>[...x])});
 });

 Object.values(state.weeks).forEach(week=>{
  week.people||={};
  state.members.forEach(m=>{
   if(!week.people[m.id])week.people[m.id]={kpis:[],tasks:[],blockers:[],plans:[]};
   delete week.people[m.id].special;
  });
 });

 /* 当前周直接套用新的 KPI 配置，同名指标保留已填实际值；历史周保持原样 */
 const active=state.weeks[state.activeWeek];
 if(active){
  state.members.forEach(m=>{
   const p=active.people[m.id];
   if(!p)return;
   const oldByName=new Map((p.kpis||[]).map(k=>[k.name,k]));
   p.kpis=kpiTemplateOf(m).map(k=>({...k,actual:oldByName.get(k.name)?.actual||""}));
  });
 }

 state.kpiVersion=KPI_CONFIG_VERSION;
 state.version=5;
 return true;
}
if(!state.weeks[state.activeWeek])state.activeWeek=Object.keys(state.weeks)[0]||monday(todayISO());
migrateKpis();

function ensureState(){
 state.submissions=state.submissions&&typeof state.submissions==="object"?state.submissions:{};
 state.members.forEach(m=>Object.values(state.weeks).forEach(w=>{
  w.people ||= {};
  if(!w.people[m.id])w.people[m.id]={kpis:[],tasks:[],blockers:[],plans:[]};
  const p=w.people[m.id];
  p.kpis=Array.isArray(p.kpis)?p.kpis:[];
  p.tasks ||= [];p.blockers ||= [];p.plans ||= [];
 }));
 if(state.selectedId!=="team"&&!state.members.some(m=>m.id===state.selectedId))state.selectedId=state.members[0]?.id||"team";
}
ensureState();

const current=()=>state.weeks[state.activeWeek];
const selected=()=>state.members.find(m=>m.id===state.selectedId);
const personData=id=>current().people[id];

 }catch(e){
  $("saveStatus").textContent="自动保存失败，请检查浏览器存储空间";
  notify("浏览器自动保存失败，请检查存储空间或清理缓存。");

}

}

function kpiStatus(k){
 const a=num(k.actual),t=num(k.target);
 if(a===null)return ["未填写","neutral"];
 if(t===null)return ["目标待确认","warn"];
 return (k.op==="lte"?a<=t:a>=t)?["达标","good"]:["未达标","bad"];
}
function taskStatus(s){
 return ({todo:["未开始","neutral"],ongoing:["进行中","warn"],review:["审核中","warn"],blocked:["受阻","bad"],done:["已完成","good"]})[s]||["未开始","neutral"];
}
function priorityOptions(){return [["high","高"],["medium","中"],["low","低"]]}
function countTasks(p){
 return {total:p.tasks.length,done:p.tasks.filter(t=>t.status==="done").length,active:p.tasks.filter(t=>["ongoing","review","blocked"].includes(t.status)).length};
}
function countOpenBlockers(p){return p.blockers.filter(b=>b.status!=="closed").length}

function renderStats(){
 let totalK=0,filled=0,totalT=0,done=0,blocks=0,plans=0;
 state.members.forEach(m=>{
  const p=personData(m.id),t=countTasks(p);
  totalK+=p.kpis.length;filled+=p.kpis.filter(k=>num(k.actual)!==null).length;
  totalT+=t.total;done+=t.done;blocks+=countOpenBlockers(p);plans+=p.plans.length;
 });
 $("stats").innerHTML=[["已填写 KPI",`${filled}/${totalK}`],["已完成任务",`${done}/${totalT}`],["未解决卡点",blocks],["下周计划",plans]]
 .map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("");
}

  return `<details class="metric">

  </details>`;
 }).join("");

 return `<div class="sectionhead">

 </div>

  <li><strong>准时交付率</strong>：以首次正式提交进入审核的时间为准。截止日期前首次进入 Review 即视为按时，审核人员延迟反馈不算设计师逾期。</li>

  <li><strong>审核等待</strong>：不算设计师制作时间。没有真实数据时留空或标记「待确认」，不估算、不虚构。</li>
 </ul></details>
 <div class="progress"><span style="width:${Math.round(filled/Math.max(1,p.kpis.length)*100)}%"></span></div>
 ${html||'<div class="placeholder">尚未设置个人 KPI。点击“新增个人 KPI”添加。</div>'}`;

function render(){
 /* 重新渲染前先记住哪些折叠记录是展开的，以及当前正在编辑的输入框。
    否则下拉框 / 日期一变化就整个重建 DOM，已展开的记录会被强制收起。 */
 const openRecords=[...document.querySelectorAll("details[open]")].map(d=>{
  const f=d.querySelector("[data-kind][data-id]");
  return f?`${f.dataset.kind}:${f.dataset.id}`:"";
 }).filter(Boolean);
 const active=document.activeElement;
 const focusInfo=active&&active.dataset&&active.dataset.kind&&active.dataset.prop
  ?{kind:active.dataset.kind,id:active.dataset.id||"",prop:active.dataset.prop,start:active.selectionStart,end:active.selectionEnd}
  :null;

 renderTop();renderNav();renderStats();
 if(state.selectedId==="team")renderTeam();else renderPerson();

 if(openRecords.length){
  document.querySelectorAll("details").forEach(d=>{
   const f=d.querySelector("[data-kind][data-id]");
   if(f&&openRecords.includes(`${f.dataset.kind}:${f.dataset.id}`))d.open=true;
  });
 }
 if(focusInfo){
  const el=document.querySelector(`[data-kind="${focusInfo.kind}"][data-id="${focusInfo.id}"][data-prop="${focusInfo.prop}"]`);
  if(el){
   el.focus({preventScroll:true});
   if(typeof el.setSelectionRange==="function"&&focusInfo.start!=null){
    try{el.setSelectionRange(focusInfo.start,focusInfo.end)}catch(_){}
   }
  }
 }
}

function addRecord(kind){
 const p=personData(state.selectedId);if(!p)return;
 if(kind==="kpi")p.kpis.push({id:uid(),name:"新 KPI 指标",target:"",unit:"%",weight:0,op:"gte",actual:"",comment:""});
 if(kind==="task")p.tasks.push({id:uid(),title:"",status:"todo",complexity:"medium",due:"",result:"",acceptance:"",notes:"",link:""});
 if(kind==="blocker")p.blockers.push({id:uid(),title:"",status:"open",priority:"medium",owner:"",due:"",impact:"",action:""});
 if(kind==="plan")p.plans.push({id:uid(),title:"",priority:"medium",due:"",owner:selected()?.name||"",accountable:"",deliverable:"",notes:""});
 save();render();notify("已新增记录");
}
function updateRecord(el){
 const kind=el.dataset.kind,id=el.dataset.id,prop=el.dataset.prop;
 if(!kind||!prop)return;
 let target;
 if(kind==="team")target=current();
 else{
  const p=personData(state.selectedId);if(!p)return;
  const list=kind==="kpi"?p.kpis:kind==="task"?p.tasks:kind==="blocker"?p.blockers:p.plans;
  target=list.find(x=>x.id===id);
 }
 if(!target)return;
 target[prop]=el.value;
 save();
}

/* 修复：KPI 输入框的值已保存，但原来的代码没有刷新折叠标题。
   现在 KPI 字段触发 change 后会重新渲染，标题、状态、侧边栏和统计数字同步更新。 */
document.addEventListener("input",e=>{
 if(e.target.matches("[data-kind][data-prop]"))updateRecord(e.target);
});
document.addEventListener("change",e=>{
 if(!e.target.matches("[data-kind][data-prop]"))return;
 updateRecord(e.target);
 if(e.target.dataset.kind==="kpi"||e.target.tagName==="SELECT"||e.target.type==="date")render();
});

function reportText(value){
 const v=value===null||value===undefined||String(value).trim()===""?"未填写":String(value);
 return esc(v).replace(/\n/g,"<br>");
}
function reportField(label,value){return `<div class="r-field"><span>${esc(label)}</span><div>${reportText(value)}</div></div>`}
function reportBadge(label,kind="neutral"){return `<span class="r-badge ${kind}">${esc(label)}</span>`}
function reportKPI(k, i) {
  const [status, cls] = kpiStatus(k);

  const target =
    k.target === "" || k.target == null
      ? "待确认"
      : `${k.op === "lte" ? "≤" : "≥"} ${k.target}${k.unit === "%" ? "%" : k.unit ? " " + k.unit : ""}`;

  const actual =
    num(k.actual) === null
      ? "未填写"
      : `${k.actual}${k.unit === "%" ? "%" : k.unit ? " " + k.unit : ""}`;

  return `
    <article class="r-kpi">
      <div class="r-kpi-top">
        <div class="r-kpi-title">
          <span class="r-kpi-index">${String(i + 1).padStart(2, "0")}</span>
          <h4>${esc(k.name || "未命名 KPI")}</h4>
        </div>
        <span class="r-badge ${cls}">${esc(status)}</span>
      </div>

      <div class="r-kpi-data">
        <div class="r-kpi-target">
          <span>目标值</span>
          <strong>${esc(target)}</strong>
        </div>

        <div class="r-kpi-actual">
          <span>实际值</span>
          <strong class="${num(k.actual) === null ? "unfilled" : ""}">
            ${esc(actual)}
          </strong>
        </div>

        <div class="r-kpi-weight">
          <span>权重</span>
          <strong>${esc(k.weight)}<small>%</small></strong>
        </div>
      </div>

      ${
        k.comment && String(k.comment).trim()
          ? `
            <div class="r-comment">
              <span>考核目的</span>
              <p>${reportText(k.comment)}</p>
            </div>
          `
          : ""
      }
    </article>
  `;
}

function reportTask(t){
 const [status,cls]=taskStatus(t.status);
 return `<article class="r-item"><div class="r-item-head"><div><h4>${esc(t.title||"未命名任务")}</h4><p class="r-subtitle">预计完成：${esc(t.due||"未定日期")}</p></div>${reportBadge(status,cls)}</div>

}
function reportBlocker(b){
 const status=({open:"待处理",inprogress:"处理中",closed:"已解决"})[b.status]||"待处理";
 const cls=b.status==="closed"?"good":b.status==="inprogress"?"warn":"bad";
 return `<article class="r-item"><div class="r-item-head"><div><h4>${esc(b.title||"未命名卡点")}</h4><p class="r-subtitle">责任人：${esc(b.owner||"未填写")} · 预计解决：${esc(b.due||"未定日期")}</p></div>${reportBadge(status,cls)}</div>
 <div class="r-fields">${reportField("业务影响 / 风险",b.impact)}${reportField("解决措施 / 已采取行动",b.action)}</div></article>`;
}
function reportPlan(p){
 const priority=({high:"高",medium:"中",low:"低"})[p.priority]||"未填写";
 const cls=p.priority==="high"?"bad":p.priority==="low"?"good":"warn";

  let doneTasks = 0;

  let openBlocks = 0;
  let totalKpis = 0;
  let filledKpis = 0;
  let planCount = 0;
  let blockerCount = 0;

    totalTasks += t.total;
    doneTasks += t.done;

    unfinishedTasks += p.tasks.filter(
      task => task.status !== "done"
    ).length;

    openBlocks += countOpenBlockers(p);
    blockerCount += p.blockers.length;
    planCount += p.plans.length;
    totalKpis += p.kpis.length;

    filledKpis += p.kpis.filter(
      k => num(k.actual) !== null
    ).length;
  });

  const dataComplete =
    totalKpis > 0 && filledKpis === totalKpis;

  const completionRate = Math.round(
    (filledKpis / Math.max(1, totalKpis)) * 100
  );

  const nav = members.map(m => `

      task => task.status !== "done"
    ).length;

    const filled = p.kpis.filter(
      k => num(k.actual) !== null

        <td>${t.done}</td>
        <td>${countOpenBlockers(p)}</td>
        <td>${p.plans.length}</td>

  }).join("");

  const sections = members.map((m, i) => {

    const unfinished = p.tasks.filter(

    const kpiWeight = p.kpis.reduce(

          <div class="r-kpi-grid">

              p.kpis.map((k, index) => reportKPI(k, index)).join("")
              || '<div class="empty-state">尚未设置个人 KPI。</div>'

        <!-- 未完成任务 -->

                <span>请补充任务、责任人、截止日期和预期成果。</span>
              </div>

      </section>
    `;
  }).join("");

async function deflateBytes(bytes){
 const cs=new CompressionStream("deflate-raw");
 return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
}
async function inflateBytes(bytes){
 const ds=new DecompressionStream("deflate-raw");
 return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
async function encodeSharePayload(source=state){
 let json=JSON.stringify(source),bytes=new TextEncoder().encode(json),flag="j";
 if(window.CompressionStream){
  try{bytes=await deflateBytes(bytes);flag="z"}catch(e){bytes=new TextEncoder().encode(json);flag="j"}
 }
 let bin="";for(const b of bytes)bin+=String.fromCharCode(b);
 return flag+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function decodeSharePayload(payload){
 const flag=payload[0],bin=atob(payload.slice(1).replace(/-/g,"+").replace(/_/g,"/"));
 let bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(flag==="z"){
  if(!window.DecompressionStream)throw new Error("当前浏览器不支持解压分享数据，请让分享者改用文件导出");
  try{bytes=await inflateBytes(bytes)}catch(e){throw new Error("分享数据已损坏或被截断（链接可能在复制时丢失了字符），请让分享者重新生成")}
 }
 return JSON.parse(new TextDecoder().decode(bytes));
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){}
 try{
  const ta=document.createElement("textarea");ta.value=text;
  ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  const ok=document.execCommand("copy");ta.remove();return ok;
 }catch(e){return false}
}

/* 提交码文本解析：成员把生成的文字发回来时用 */
const AI_TASK_STATUS=["todo","ongoing","review","blocked","done"];
const AI_BLOCK_STATUS=["open","inprogress","closed"];
const AI_TASK_STATUS_MAP={"未开始":"todo","进行中":"ongoing","审核中":"review","受阻":"blocked","已完成":"done","todo":"todo","ongoing":"ongoing","review":"review","blocked":"blocked","done":"done"};
const AI_BLOCK_STATUS_MAP={"待处理":"open","处理中":"inprogress","已解决":"closed","open":"open","inprogress":"inprogress","closed":"closed"};
const AI_PRIORITY_MAP={"高":"high","中":"medium","低":"low","high":"high","medium":"medium","low":"low"};

function aiText(v,fallback){return v==null||v===""?String(fallback??""):String(v)}

function normalizeStatus(map,value,fallback){
 const key=String(value||"").trim();
 return map[key]||map[key.toLowerCase()]||fallback;
}
function normalizeDate(value){
 const text=String(value||"").trim();
 const m=text.match(/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
 return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:"";
}

function parsePipeText(source){
 const list=[];
 let block=null,section=null;

 source.split("\n").forEach(rawLine=>{
  const line=rawLine.trim();
  if(!line)return;

  const memberLine=line.match(/^(?:【成员】|\[成员\]|成员\s*[：:])\s*(.+)$/);
  if(memberLine){
   block={name:memberLine[1].replace(/[｜|：:，,。]+$/,"").trim(),kpis:[],tasks:[],blockers:[],plans:[]};
   list.push(block);
   section=null;
   return;
  }

  const headLine=line.match(/^(?:【(.+)】|@(.+)|#(.+))$/);
  if(headLine){
   const title=(headLine[1]||headLine[2]||headLine[3]||"").trim();
   if(/kpi/i.test(title))section="kpis";
   else if(/(卡点|问题|阻塞)/.test(title))section="blockers";
   else if(/计划/.test(title))section="plans";
   else if(/任务/.test(title))section="tasks";
   else section=null;
   return;
  }

  if(!block||!section)return;
  const cells=line.split(/\s*[｜|]\s*/).map(x=>x.trim());
  if(!cells[0])return;

  if(section==="kpis"){
   block.kpis.push({name:cells[0],actual:cells[1]||"",comment:cells.slice(2).join("｜").trim()});
  }else if(section==="tasks"){
   block.tasks.push({title:cells[0],status:normalizeStatus(AI_TASK_STATUS_MAP,cells[1],"ongoing"),due:normalizeDate(cells[2]),result:cells[3],acceptance:cells[4],notes:cells[5],link:cells[6]});
  }else if(section==="blockers"){
   block.blockers.push({title:cells[0],status:normalizeStatus(AI_BLOCK_STATUS_MAP,cells[1],"open"),priority:normalizeStatus(AI_PRIORITY_MAP,cells[2],"medium"),owner:cells[3],due:normalizeDate(cells[4]),impact:cells[5],action:cells[6]});
  }else{
   block.plans.push({title:cells[0],priority:normalizeStatus(AI_PRIORITY_MAP,cells[1],"medium"),due:normalizeDate(cells[2]),owner:cells[3],accountable:cells[4],deliverable:cells[5],notes:cells[6]});
  }
 });

 if(!list.length)throw new Error("没有找到【成员】行");
 return list;
}

async function inviteMembers(){
 save();
 const wrap=showModal({title:"邀请成员填写",desc:"成员打开链接后只能看到自己这一页：任务、卡点、下周计划，看不到 KPI，也看不到别人的内容。有同步服务器时，他点提交你这边就能收到；没有服务器时，会生成一段提交码由你手动导入。",body:'<div id="inviteList"><p>正在准备链接…</p></div>',wide:true});
 const host=wrap.querySelector("#inviteList");
 // 先把「复制链接」的点击规则挂上，避免下面提前 return 时按钮失去响应
 wrap.addEventListener("click",async e=>{
  const b=e.target.closest("[data-copy-link]");if(!b)return;
  const row=b.closest(".invite-row");
  const name=row&&row.querySelector("strong")?row.querySelector("strong").textContent:"成员";
  const ok=await copyText(b.dataset.copyLink);
  if(!ok){
   const box=row&&row.querySelector(".linkbox");
   if(box){box.focus();box.select()}
   else if(row){
    // 短链接模式下没有输入框，就把链接文字选中，方便手动 Ctrl+C
    const small=row.querySelector("small");
    if(small){
     const range=document.createRange();range.selectNodeContents(small);
     const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    }
   }
  }
  notify(ok?"链接已复制，发给 "+name:"复制失败，链接已帮你选中，按 Ctrl+C 复制");
 });
 try{
  const online=await hasServer();
  if(online){
   const roster={week:state.activeWeek,members:state.members.map(m=>{
    const p=personData(m.id)||{kpis:[],tasks:[],blockers:[],plans:[]};
    return {id:m.id,name:m.name,role:m.role,desc:m.desc||"",color:m.color,
     kpis:p.kpis.map(k=>({n:k.name,t:k.target,u:k.unit,w:k.weight,o:k.op})),
     tasks:p.tasks,blockers:p.blockers,plans:p.plans};
   })};
   const r=await fetch("/api/roster",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(roster)});
   if(!r.ok)throw new Error("服务器返回 "+r.status);
   const out=await r.json();
   const lack=state.members.filter(m=>!out.tokens||!out.tokens[m.id]);
   if(lack.length)throw new Error("服务器没给这些成员分链接："+lack.map(m=>m.name).join("、")+"，请刷新页面后重试");
   const base=out.base||location.origin;
   host.innerHTML=state.members.map(m=>{
    const link=`${base}/f/${out.tokens[m.id]}`;
    return `<div class="invite-row"><div class="who"><strong>${esc(m.name)}</strong><small>${esc(link)}</small></div><button class="ghost small" data-copy-link="${esc(link)}">复制链接</button></div>`;
   }).join("")+`<p style="margin:10px 0 0;color:#6c7888;font-size:12px">成员提交后，你点「同步成员提交」即可合并；页面打开着时每 60 秒也会自动检查一次。<br>链接用的是服务器自动识别的地址（${esc(base)}），同事连同一个 WiFi 就能打开。</p>`;
   return;
  }
  if(location.protocol==="file:"){
   host.innerHTML='<p>没有检测到同步服务器。请先在文件夹里运行 <b>node server.js</b>，再用 http://localhost:8787 打开本页。</p>';
   return;
  }
  const tip='<p style="margin:0 0 10px;padding:9px 11px;border:1px solid #f0c8a0;background:#fdf3e7;color:#a8611f;font-size:12px;border-radius:8px">没有连上同步服务器（你现在是用 <b>'+esc(location.host||"本地文件")+'</b> 打开的），所以下面是旧的「长链接 + 提交码」方式。<br>想要短链接、成员点提交你这边自动收到：先双击 <b>start-server.bat</b>，再用窗口里显示的 <b>http://局域网IP:8787</b> 打开本页，然后再点「邀请成员填写」。</p>';
  const rows=await Promise.all(state.members.map(async m=>({m,link:await buildFillLink(m.id)})));
  const links=rows.map(r=>r.link);
  const dup=links.some((l,i)=>links.indexOf(l)!==i);
  const dupTip=dup?'<p style="margin:0 0 10px;padding:9px 11px;border:1px solid #f0b0b0;background:#fdeaea;color:#a83232;font-size:12px;border-radius:8px">注意：检测到有多条链接内容完全一样，说明当前数据异常（可能是成员编号重复）。请刷新页面后重试。</p>':"";
  host.innerHTML=tip+dupTip+rows.map(r=>`<div class="invite-row"><div class="who"><strong>${esc(r.m.name)}</strong><small>${esc(r.m.role)}</small><textarea readonly class="linkbox" spellcheck="false" onclick="this.select()">${esc(r.link)}</textarea></div><button class="ghost small" data-copy-link="${esc(r.link)}">复制链接</button></div>`).join("");
 }catch(e){host.innerHTML='<p>链接生成失败：'+esc(e.message)+'</p>'}
}

function receiveSubmission(text){
 const src=String(text||"").replace(/\r\n/g,"\n").trim();
 if(!src)throw new Error("还没有粘贴提交码");
 const week=(src.match(/【周期】\s*(\d{4}-\d{2}-\d{2})/)||[])[1]||"";
 const list=parsePipeText(src);
 if(list.length!==1)throw new Error("一次只能导入一位成员，请检查提交码是否完整");
 const item=list[0];
 const target=item.name.trim().toLowerCase();
 const member=state.members.find(x=>x.name.trim().toLowerCase()===target||x.id.toLowerCase()===target);
 if(!member)throw new Error("找不到成员「"+item.name+"」，请确认提交码里的姓名和页面一致");
 if(week&&week!==state.activeWeek){
  if(!confirm(`这条提交属于 ${week} 那一周，当前显示的是 ${state.activeWeek}。是否切换到 ${week} 并导入？`))return false;
  switchWeek(week);
 }
 const p=personData(member.id);
 p.tasks=item.tasks.map(t=>{
  const title=aiText(t.title);
  const old=p.tasks.find(x=>String(x.title||"").trim()===title.trim());
  return {id:uid(),title,status:AI_TASK_STATUS.includes(t.status)?t.status:"ongoing",complexity:old?old.complexity:"medium",due:aiText(t.due),result:aiText(t.result),acceptance:aiText(t.acceptance),notes:aiText(t.notes),link:aiText(t.link)};
 });
 p.blockers=item.blockers.map(b=>({id:uid(),title:aiText(b.title),status:AI_BLOCK_STATUS.includes(b.status)?b.status:"open",priority:aiText(b.priority,"medium"),owner:aiText(b.owner),due:aiText(b.due),impact:aiText(b.impact),action:aiText(b.action)}));
 p.plans=item.plans.map(x=>({id:uid(),title:aiText(x.title),priority:aiText(x.priority,"medium"),due:aiText(x.due),owner:aiText(x.owner,member.name),accountable:aiText(x.accountable),deliverable:aiText(x.deliverable),notes:aiText(x.notes)}));
 state.submissions[state.activeWeek]||={};
 state.submissions[state.activeWeek][member.id]={at:new Date().toISOString()};
 state.selectedId=member.id;
 save();
 document.body.classList.remove("compact");
 $("detailToggle").textContent="收起详情";
 render();
 notify(`${member.name} 的提交已导入：任务 ${p.tasks.length} 条、卡点 ${p.blockers.length} 条、计划 ${p.plans.length} 条`);
 return true;
}

function openReceiveSubmission(){
 const wrap=showModal({title:"接收成员提交",desc:"把成员发回来的提交码整段粘贴进来。导入会覆盖该成员本周的任务、卡点和下周计划，KPI 不受影响。",body:'<textarea id="subInput" placeholder="【成员】Zoran&#10;【周期】2026-10-26&#10;【KPI】&#10;【未完成任务】&#10;任务｜ongoing｜2026-11-06｜…"></textarea>'});
 wrap.querySelector(".modal-actions").insertAdjacentHTML("afterbegin",'<button class="primary" id="subApply">导入到本周</button>');
 wrap.querySelector("#subApply").onclick=()=>{
  try{if(receiveSubmission(wrap.querySelector("#subInput").value)!==false)wrap.remove()}
  catch(err){notify("导入失败："+err.message)}
 };
}

/* ----- 成员填写页（?fill=数据）----- */
const FILL_KEY="aftershock_fill_draft";
const FILL_TASK_OPTS=[["todo","未开始"],["ongoing","进行中"],["review","审核中"],["blocked","受阻"],["done","已完成"]];
const FILL_BLOCK_OPTS=[["open","未解决"],["inprogress","处理中"],["closed","已解决"]];
const FILL_PRIO_OPTS=[["high","高"],["medium","中"],["low","低"]];
let fillData=null;
const fillArr=g=>g==="t"?fillData.d.t:g==="b"?fillData.d.b:fillData.d.p;

function fillSelect(field,opts,value,i){
 return `<select data-fill="${field}" data-index="${i}">${opts.map(o=>`<option value="${o[0]}" ${o[0]===value?"selected":""}>${o[1]}</option>`).join("")}</select>`;
}
function saveFillDraft(){
 if(!fillData)return;
 try{localStorage.setItem(fillData.key,JSON.stringify({d:fillData.d,at:Date.now()}))}catch(e){}
 paintSubmitState();
}
/* 当前填写内容的指纹，用来判断提交之后有没有再改过 */
function fillSnapshot(){
 if(!fillData)return "";
 return JSON.stringify({t:fillData.d.t||[],b:fillData.d.b||[],p:fillData.d.p||[]});
}
/* 底部按钮状态：未提交=提交；已提交=更新提交；改了内容会提示 */
function paintSubmitState(){
 const btn=$("fillSubmit"),line=$("fillSubState");
 if(!btn)return;
 if(!fillData.online){if(line)line.textContent="";return}
 const dirty=!!fillData.baseline&&fillSnapshot()!==fillData.baseline;
 const empty=!fillData.d.t.length&&!fillData.d.b.length&&!fillData.d.p.length;
 if(fillData.submittedAt){
  btn.disabled=false;
  btn.textContent="更新提交";
  if(line)line.textContent=empty
   ?"内容已全部清空，点「更新提交」让负责人那边也一起清空"
   :dirty
   ?"内容有改动，点「更新提交」把最新版本发过去"
   :"上次提交 "+new Date(fillData.submittedAt).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})+"，有变动可再次提交覆盖";
 }else if(line)line.textContent="";
}
function fillItemHTML(g,item,i){
 if(g==="t")return `<div class="fillitem">
  <div class="row"><input data-fill="t.title" data-index="${i}" value="${esc(item.title||"")}" placeholder="任务名称"><button class="small del" data-del="t" data-index="${i}">删除</button></div>
  <div class="row two"><div><label>状态</label>${fillSelect("t.status",FILL_TASK_OPTS,item.status||"ongoing",i)}</div><div><label>预计完成</label><input type="date" data-fill="t.due" data-index="${i}" value="${esc(item.due||"")}"></div></div>
  <textarea data-fill="t.notes" data-index="${i}" placeholder="当前进度 / 剩余工作 / 需要谁支持">${esc(item.notes||"")}</textarea>
 </div>`;
 if(g==="b")return `<div class="fillitem">
  <div class="row"><input data-fill="b.title" data-index="${i}" value="${esc(item.title||"")}" placeholder="卡点或问题"><button class="small del" data-del="b" data-index="${i}">删除</button></div>
  <div class="row two"><div><label>状态</label>${fillSelect("b.status",FILL_BLOCK_OPTS,item.status||"open",i)}</div><div><label>优先级</label>${fillSelect("b.priority",FILL_PRIO_OPTS,item.priority||"medium",i)}</div></div>
  <div class="row two"><div><label>需要谁支持</label><input data-fill="b.owner" data-index="${i}" value="${esc(item.owner||"")}" placeholder="如客户/产品/开发"></div><div><label>预计解决</label><input type="date" data-fill="b.due" data-index="${i}" value="${esc(item.due||"")}"></div></div>
  <textarea data-fill="b.impact" data-index="${i}" placeholder="影响、需要什么帮助">${esc(item.impact||"")}</textarea>
 </div>`;
 return `<div class="fillitem">
  <div class="row"><input data-fill="p.title" data-index="${i}" value="${esc(item.title||"")}" placeholder="计划名称"><button class="small del" data-del="p" data-index="${i}">删除</button></div>
  <div class="row two"><div><label>优先级</label>${fillSelect("p.priority",FILL_PRIO_OPTS,item.priority||"medium",i)}</div><div><label>截止日期</label><input type="date" data-fill="p.due" data-index="${i}" value="${esc(item.due||"")}"></div></div>
  <textarea data-fill="p.deliverable" data-index="${i}" placeholder="要交付的成果">${esc(item.deliverable||"")}</textarea>
 </div>`;
}
function renderFillLists(){
 if(!fillData)return;
 [["t","fillT","本周暂无未完成任务"],["b","fillB","暂无卡点"],["p","fillP","暂无下周计划"]].forEach(([g,id,empty])=>{
  const list=fillArr(g);
  $(id).innerHTML=list.length?list.map((x,i)=>fillItemHTML(g,x,i)).join(""):`<div class="placeholder">${empty}</div>`;
 });
}
function buildSubmissionCode(){
 const c=v=>String(v==null?"":v).replace(/\r?\n/g," / ").replace(/[｜|]/g,"／").trim();
 const d=fillData.d;
 const lines=[`【成员】${fillData.m.name}`,`【周期】${fillData.w}`,"【KPI】","【未完成任务】"];
 d.t.forEach(t=>lines.push([c(t.title),t.status||"ongoing",c(t.due),c(t.result),c(t.acceptance),c(t.notes),c(t.link)].join("｜")));
 lines.push("【卡点】");
 d.b.forEach(b=>lines.push([c(b.title),b.status||"open",b.priority||"medium",c(b.owner),c(b.due),c(b.impact),c(b.action)].join("｜")));
 lines.push("【下周计划】");
 d.p.forEach(x=>lines.push([c(x.title),x.priority||"medium",c(x.due),c(x.owner),c(x.accountable),c(x.deliverable),c(x.notes)].join("｜")));
 return lines.join("\n");
}
function fillError(title,msg){
 document.body.style.visibility="visible";
 document.documentElement.style.visibility="visible";
 document.body.innerHTML=`<div style="max-width:520px;margin:80px auto;padding:24px;border:1px solid #283340;border-radius:12px;background:#121921;color:#e9eff7;font:14px/1.7 'Microsoft YaHei',sans-serif">
  <h3 style="margin:0 0 8px">${esc(title)}</h3><p style="color:#8f9fb2;margin:0">${esc(msg)}</p>
  <p style="color:#65778c;margin:12px 0 0;font-size:12px">请让负责人重新生成你的填写链接。</p></div>`;
}
function mountFillPage(){
 const color=fillData.m.color||"#f17b59";
 document.body.className="";
 document.body.innerHTML=`<div class="fill">
  <div class="fill-head">
   <span class="avatar" style="width:46px;height:46px;font-size:15px;background:${color}22;color:${color}">${esc(fillData.m.name.slice(0,2).toUpperCase())}</span>
   <div><h1>${esc(fillData.m.name)}</h1><div class="muted">${esc(fillData.m.role)} · ${fillData.w} 至 ${endOfWeek(fillData.w)}</div></div>
  </div>
  <div class="note">你只需要填写下面三块（KPI 由负责人统一管理，不在成员页面显示）。${fillData.online?"填完点底部「提交给负责人」，提交后负责人那边就能看到。":"填完点底部「生成提交码」，把生成的文字发给负责人即可。"}${fillData.hasDraft?" 已恢复你上次没提交的草稿。":""}</div>
  <section class="card"><div class="sectionhead"><div><h3>未完成任务</h3><p>还没做完的事、目前进度和预计完成时间。</p></div><button class="small" data-add="t">＋ 新增</button></div><div id="fillT"></div></section>
  <section class="card"><div class="sectionhead"><div><h3>卡点 &amp; 现存问题</h3><p>影响进度的事，需要谁支持。</p></div><button class="small" data-add="b">＋ 新增</button></div><div id="fillB"></div></section>
  <section class="card"><div class="sectionhead"><div><h3>下周工作计划</h3><p>下周准备交付的成果和截止时间。</p></div><button class="small" data-add="p">＋ 新增</button></div><div id="fillP"></div></section>
  <p class="muted" style="text-align:center;font-size:11px">填写内容会自动保存在这台设备，关掉页面再打开可以继续填。</p>
  <div class="fillbar" style="flex-wrap:wrap"><p id="fillSubState" style="flex:1 1 100%;margin:0;text-align:center;font-size:11px;color:#8f9fb2"></p><button class="primary" id="fillSubmit">${fillData.online?"提交给负责人":"生成提交码"}</button></div>
 </div>
 <div class="toast" id="toastFill"></div>`;
 renderFillLists();
 document.body.style.visibility="visible";
 document.documentElement.style.visibility="visible";
 saveFillDraft();
 $("fillSubmit").onclick=async()=>{
  const total=fillData.d.t.length+fillData.d.b.length+fillData.d.p.length;
  // 没填过东西才拦；已经提交过的人把内容全删空，必须允许提交空内容，否则负责人那边永远清不掉
  if(!total){
   if(!fillData.submittedAt){notify("还没有填写任何内容");return}
   if(!confirm("你已经把内容全部删空了，提交后负责人那边也会一并清空。确定提交吗？"))return;
  }
  const btn=$("fillSubmit");
  if(fillData.online){
   const old=btn.textContent;btn.disabled=true;btn.textContent="正在提交…";
   try{
    const url=fillData.token?`/api/fill/${fillData.token}`:"/api/submit";
    const payload=fillData.token
     ?{tasks:fillData.d.t,blockers:fillData.d.b,plans:fillData.d.p}
     :{memberId:fillData.m.id,week:fillData.w,tasks:fillData.d.t,blockers:fillData.d.b,plans:fillData.d.p};
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||("提交失败（"+r.status+"）"))}
    const out=await r.json().catch(()=>({}));
    try{localStorage.removeItem(fillData.key)}catch(e){}
    fillData.submittedAt=out.submittedAt||new Date().toISOString();
    fillData.baseline=fillSnapshot();
    paintSubmitState();
    notify("已提交给负责人；之后改了内容，再点「更新提交」就能覆盖旧版本");
   }catch(e){btn.disabled=false;btn.textContent=old;notify("提交失败："+e.message)}
   return;
  }
  const code=buildSubmissionCode();
  const wrap=showModal({title:"把这段提交码发给负责人",desc:"复制后粘贴到微信或飞书发给负责人即可。提交码只包含你本周的任务、卡点和下周计划。",body:`<textarea readonly id="codeBox">${esc(code)}</textarea>`,wide:true});
  wrap.querySelector(".modal-actions").insertAdjacentHTML("afterbegin",'<button class="primary" id="copyCode">复制提交码</button>');
  wrap.querySelector("#copyCode").onclick=async()=>{const ok=await copyText(code);notify(ok?"提交码已复制，直接粘贴发给负责人":"复制失败，请手动全选复制")};
  const ok=await copyText(code);
  notify(ok?"提交码已复制，直接粘贴发给负责人":"请点「复制提交码」手动复制");
 };
}

async function startFillMode(raw){
 let data;
 try{data=await decodeSharePayload(raw)}catch(e){fillError("链接打不开","链接可能在转发时被截断或复制不完整。");return}
 if(!data||!data.m||!data.d){fillError("链接内容不完整","这条链接缺少成员信息。");return}
 const key=`${FILL_KEY}_${data.m.id}_${data.w}`;
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
 const online=await hasServer();
 fillData={m:data.m,w:data.w,k:data.k||[],key,hasDraft:!!saved,online,token:null,
  d:saved&&saved.d?saved.d:{t:data.d.t||[],b:data.d.b||[],p:data.d.p||[]}};
 mountFillPage();
}

/* 服务器模式：链接形如 /f/a1b2c3d4e5，数据从服务器读取，提交也直接回写服务器 */
async function startServerFill(token){
 try{
  const r=await fetch(`/api/fill/${encodeURIComponent(token)}`,{cache:"no-store"});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||("链接无效（"+r.status+"）"));
  const key=`${FILL_KEY}_${token}`;
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  const base=data.submitted
   ?{t:data.submitted.tasks||[],b:data.submitted.blockers||[],p:data.submitted.plans||[]}
   :{t:(data.data&&data.data.t)||[],b:(data.data&&data.data.b)||[],p:(data.data&&data.data.p)||[]};
  fillData={m:data.member,w:data.week,key,hasDraft:!!saved,online:true,token,
   submittedAt:(data.submitted&&data.submitted.submittedAt)||"",
   baseline:data.submitted?JSON.stringify({t:base.t,b:base.b,p:base.p}):"",
   d:saved&&saved.d?saved.d:base};
  mountFillPage();
 }catch(e){fillError("链接打不开",e.message)}
}

/* 填写页的输入与增删（平时 fillData 为空，不影响主界面） */
document.addEventListener("input",e=>{
 if(!fillData)return;
 const f=e.target.dataset&&e.target.dataset.fill;if(!f)return;
 const [g,prop]=f.split(".");
 const i=Number(e.target.dataset.index||0);
 const arr=fillArr(g);
 if(arr[i]){arr[i][prop]=e.target.value;saveFillDraft()}
});
document.addEventListener("click",e=>{
 if(!fillData)return;
 const add=e.target.closest("[data-add]");
 if(add){
  const g=add.dataset.add;
  const defaults={t:()=>({id:uid(),title:"",status:"ongoing",complexity:"medium",due:"",result:"",acceptance:"",notes:"",link:""}),
   b:()=>({id:uid(),title:"",status:"open",priority:"medium",owner:"",due:"",impact:"",action:""}),
   p:()=>({id:uid(),title:"",priority:"medium",due:"",owner:fillData.m.name,accountable:"",deliverable:"",notes:""})};
  fillArr(g).push(defaults[g]());
  saveFillDraft();renderFillLists();
  const box=document.querySelector(`#fill${g.toUpperCase()} .fillitem:last-child input`);
  if(box)box.focus();
  return;
 }
 const del=e.target.closest("[data-del]");
 if(del){
  const g=del.dataset.del,i=Number(del.dataset.index);
  const arr=fillArr(g);if(!arr[i])return;
  if(!confirm("确定删除这条内容吗？"))return;
  arr.splice(i,1);saveFillDraft();renderFillLists();
 }
});

/* 判断当前是不是跑在同步服务器上（GitHub Pages / 本地双击都会返回 false） */
function hasServer(){
 return fetch("/api/health",{cache:"no-store"}).then(r=>r.ok).catch(()=>false);
}
/* 从服务器拉取本周已提交的内容，合并进主界面；silent=true 时不弹提示 */
async function syncSubmissions(silent=false){
 try{
  const r=await fetch(`/api/submissions?week=${encodeURIComponent(state.activeWeek)}`,{cache:"no-store"});
  if(!r.ok)throw new Error("服务器返回 "+r.status);
  const out=await r.json();
  const subs=out.submissions||[];
  if(!subs.length){if(!silent)notify("本周还没有成员提交");return 0}
  state.submissions[state.activeWeek]=state.submissions[state.activeWeek]||{};
  let fresh=0;
  subs.forEach(s=>{
   const m=state.members.find(x=>x.id===s.memberId)||state.members.find(x=>x.name===s.name);
   if(!m)return;
   const known=state.submissions[state.activeWeek][m.id];
   if(known&&known.at===s.submittedAt)return;   // 已经同步过，跳过
   const p=personData(m.id);if(!p)return;
   p.tasks=(s.data.tasks||[]).map(t=>({...t,id:t.id||uid()}));
   p.blockers=(s.data.blockers||[]).map(b=>({...b,id:b.id||uid()}));
   p.plans=(s.data.plans||[]).map(x=>({...x,id:x.id||uid()}));
   state.submissions[state.activeWeek][m.id]={at:s.submittedAt,online:true};
   fresh++;
  });
  if(fresh){save();render();notify(`已同步 ${fresh} 位成员的提交`)}
  else if(!silent)notify("没有新的提交");
  return fresh;
 }catch(e){if(!silent)notify("同步失败："+e.message);return 0}
}

$("inviteMembers").onclick=inviteMembers;
$("receiveSubmit").onclick=openReceiveSubmission;
$("syncSubmissions").onclick=()=>syncSubmissions(false);
$("clearWeek").onclick=clearWeekData;

const fillParam=new URLSearchParams(location.search).get("fill");
const fillToken=(location.pathname.match(/^\/f\/([A-Za-z0-9_-]+)\/?$/)||[])[1];
if(fillToken){
 document.documentElement.style.visibility="hidden";
 startServerFill(fillToken);
}else if(fillParam){
 document.documentElement.style.visibility="hidden";
 startFillMode(fillParam);
}else{
 render();
 save();
 // 服务器模式：进入页面先静默同步一次，之后每 60 秒检查有没有新提交
 if(location.protocol!=="file:"){
  hasServer().then(ok=>{
   if(!ok)return;
   syncSubmissions(true);
   setInterval(()=>{if(!document.hidden)syncSubmissions(true)},60000);
  });
 }
}
})();
