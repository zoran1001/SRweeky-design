<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>AFTERSHOCK | Design Team KPI Manager</title>
<style>
:root{--bg:#090d13;--panel:#121921;--line:#283340;--line2:#364251;--text:#e9eff7;--muted:#8f9fb2;--sub:#65778c;--red:#ef4053;--orange:#ff974e;--green:#48d5a0;--blue:#7aaefc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:#232e3b;color:var(--text);padding:9px 12px;border-radius:8px}
button:hover{background:#324153}
button.primary{background:#e34153;border-color:#e34153;color:white}
button.danger{color:#ff8a95}
button.small{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;background:#0e151d;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:85px;resize:vertical}
input[type=date]{color-scheme:dark}
.app{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}
.sidebar{background:#10161e;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line)}
.brand strong{font-size:17px;letter-spacing:1px}
.brand strong span{color:var(--red)}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.8px;margin-bottom:7px}
.weekbox{padding:0 7px}
.weekbox input,.weekbox select{margin-bottom:8px}
.nav{display:grid;gap:5px}
.nav button{display:flex;align-items:center;text-align:left;gap:10px;background:transparent;border-color:transparent;padding:10px}
.nav button.active{background:#261e27;border-color:#6d3340}
.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;flex-shrink:0;font-weight:800}
.navtext{min-width:0;flex:1}
.navtext strong{display:block}
.navtext small{display:block;color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navcount{color:var(--muted);font-size:11px}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.main{padding:26px 30px 60px;min-width:0;max-width:1800px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:1px}
h1{font-size:24px;margin:3px 0 5px}
h2{font-size:21px;margin:0}
h3{font-size:16px;margin:0}
p{margin:4px 0}
.muted{color:var(--muted);font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:17px}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:14px}
.stat{margin:0;background:linear-gradient(150deg,#18212d,#121921)}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:26px;margin-top:4px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.sectionhead p{font-size:12px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .avatar{width:58px;height:58px;font-size:20px}
.hero .info{flex:1;min-width:180px}
.hero .desc{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;color:#b7c8d9;background:#1b2835;white-space:nowrap}
.good{color:#73e6b4;background:#16332a;border-color:#2c6150}
.warn{color:#ffd087;background:#3b2a1b;border-color:#684a30}
.bad{color:#ff9ba7;background:#3d2029;border-color:#6b3440}
.neutral{color:#b7c5d7;background:#222b38}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:#9faec1;font-weight:600}
.field.wide{grid-column:1/-1}
.metric{border:1px solid var(--line);border-radius:10px;background:#151f2a;margin-bottom:8px;overflow:hidden}
.metric summary{display:grid;grid-template-columns:minmax(0,1.7fr) 110px 100px 90px;gap:10px;align-items:center;padding:12px;cursor:pointer;list-style:none}
.metric summary::-webkit-details-marker,.record summary::-webkit-details-marker{display:none}
.metric summary:hover,.record summary:hover{background:#202c3a}
.metricname{font-weight:700;overflow-wrap:anywhere}
.metricbody{padding:14px;border-top:1px solid var(--line);background:#111923}
.record{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#151e29;overflow:hidden}
.record summary{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;list-style:none}
.recordtitle{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.recordbody{padding:14px;border-top:1px solid var(--line);background:#111922}
.placeholder{padding:22px;border:1px dashed var(--line2);border-radius:10px;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#17202b;color:var(--muted)}
tr[data-person]{cursor:pointer}
tr[data-person]:hover td{background:#202c3a}
.note{font-size:12px;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.progress{height:6px;border-radius:20px;background:#303d4e;overflow:hidden;margin:12px 0}
.progress span{height:100%;display:block;background:var(--green)}
.toast{position:fixed;right:20px;bottom:20px;background:#274335;border:1px solid #3e7258;color:#b5f0cd;padding:12px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1}
footer{color:var(--sub);font-size:11px;margin-top:20px}
@media(max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr)}.main{padding:20px 15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 body{font-size:13.5px}
 .app{display:block}
 .sidebar{position:static;height:auto;padding:10px 10px 8px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:2px 4px 9px}
 .brand strong{font-size:15px}
 .brand small{font-size:9px;margin-top:3px}
 .weekbox{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
 .weekbox .label{grid-column:1/-1;margin-bottom:0}
 .weekbox input,.weekbox select{margin:0}
 #newWeek{grid-column:1/-1}
 .weekbox p.muted{grid-column:1/-1;margin:0;font-size:11px}
 .nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 .nav button{padding:7px 8px;gap:8px}
 .avatar{width:26px;height:26px;font-size:11px}
 .navtext strong{font-size:12.5px}
 .navtext small{font-size:10px}
 .navcount{font-size:10px}
 .sidebar-bottom{margin-top:2px;padding-top:9px;grid-template-columns:1fr 1fr;gap:6px}
 .sidebar-bottom button{padding:8px 6px;font-size:12px;line-height:1.35}
 .sidebar-bottom .muted{grid-column:1/-1;text-align:center}
 .main{padding:14px 10px 40px}
 .top{margin-bottom:14px;gap:8px}
 h1{font-size:20px}
 h2{font-size:17px}
 h3{font-size:15px}
 .sectionhead{margin-bottom:10px}
 .card{padding:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}
 .stat{padding:11px}
 .stat strong{font-size:20px}
 .grid{grid-template-columns:1fr}
 .field.wide{grid-column:auto}
 input,select,textarea{font-size:16px;padding:9px}
 textarea{min-height:76px}
 button{font-size:13px}
 .hero .avatar{width:46px;height:46px;font-size:16px}
 .hero .info{min-width:0}
 .pills{gap:5px}
 .pill{font-size:10px;padding:3px 7px}
 .metric summary{grid-template-columns:minmax(0,1fr) 62px 58px;gap:6px;padding:10px;font-size:11px}
 .metric summary .pill{display:none}
 .metricbody{padding:10px}
 .record summary{padding:10px;flex-wrap:wrap;row-gap:4px}
 .recordbody{padding:10px}
 th,td{padding:8px;font-size:11px}
 .toast{left:12px;right:12px;bottom:12px;text-align:center}
 .actions{width:100%}
 .actions button{flex:1}
 footer{margin-top:14px}
}
@media print{body{background:white;color:#111}.sidebar,.actions,button{display:none!important}.app{display:block}.main{padding:0}.card,.stat,.record,.metric{background:white;color:#111;box-shadow:none;border-color:#ddd}.metricbody,.recordbody{background:white}.muted,.field label{color:#444}input,select,textarea{background:white;color:#111;border-color:#ddd}.metric,.record{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <strong>AFTER<span>SHOCK</span></strong>

</div>

const dateObj=s=>{const [y,m,d]=(s||todayISO()).split("-").map(Number);return new Date(y,m-1,d||1,12)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const monday=s=>{const d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const endOfWeek=s=>{const d=dateObj(s);d.setDate(d.getDate()+6);return iso(d)};
const nextWeek=s=>{const d=dateObj(s);d.setDate(d.getDate()+7);return iso(d)};

const num=v=>v===""||v==null||!Number.isFinite(Number(v))?null:Number(v);

function createKPI(x){
 return {id:uid(),name:x[0],target:x[1],unit:x[2],weight:x[3],op:x[4],comment:x[5]||"",actual:""};
}
function createPerson(member){
 return {kpis:(member.kpis||[]).filter(Array.isArray).map(createKPI),tasks:[],blockers:[],plans:[]};
}
function initialState(){
 const w=monday(todayISO()),people={};
 PROFILES.forEach(m=>people[m.id]={kpis:m.kpis.map(createKPI),tasks:[],blockers:[],plans:[]});
 return {version:5,members:PROFILES.map(m=>({...m,kpis:m.kpis.map(x=>[...x])})),activeWeek:w,selectedId:"zoran",weeks:{[w]:{people,teamNotes:"",createdAt:new Date().toISOString()}}};
}

let state;
try{
 state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 if(!state||!Array.isArray(state.members)||!state.weeks)state=initialState();
}catch(e){state=initialState();}

function migrateKpis(){
 PROFILES.forEach(profile=>{
  let member=state.members.find(m=>m.id===profile.id);
  if(!member){member={...profile};state.members.push(member);}
  Object.assign(member,{name:profile.name,role:profile.role,desc:profile.desc,color:profile.color,kpis:profile.kpis.map(x=>[...x])});

  const currentNames=new Set(profile.kpis.map(x=>x[0]));
  const legacyNames=new Set(LEGACY_DEFAULTS[profile.id]||[]);

  Object.values(state.weeks).forEach(week=>{
   week.people ||= {};
   let p=week.people[profile.id];
   if(!p){week.people[profile.id]={kpis:profile.kpis.map(createKPI),tasks:[],blockers:[],plans:[]};return;}

   p.kpis=Array.isArray(p.kpis)?p.kpis:[];
   const oldByName=new Map(p.kpis.map(k=>[k.name,k]));
   const updated=profile.kpis.map(def=>{
    const old=oldByName.get(def[0]);
    return {
     id:old?.id||uid(),name:def[0],target:def[1],unit:def[2],weight:def[3],op:def[4],
     actual:old?.actual??"",comment:old?.comment||def[5]||""
    };
   });
   const custom=p.kpis.filter(k=>!legacyNames.has(k.name)&&!currentNames.has(k.name));
   p.kpis=[...updated,...custom];
   p.tasks ||= [];p.blockers ||= [];p.plans ||= [];
  });
 });

 state.version=5;
}
if(!state.weeks[state.activeWeek])state.activeWeek=Object.keys(state.weeks)[0]||monday(todayISO());
migrateKpis();

function ensureState(){
 state.members.forEach(m=>Object.values(state.weeks).forEach(w=>{
  w.people ||= {};
  if(!w.people[m.id])w.people[m.id]={kpis:[],tasks:[],blockers:[],plans:[]};
  const p=w.people[m.id];
  p.kpis=Array.isArray(p.kpis)?p.kpis:[];
  p.tasks ||= [];p.blockers ||= [];p.plans ||= [];
 }));
 if(state.selectedId!=="team"&&!state.members.some(m=>m.id===state.selectedId))state.selectedId=state.members[0]?.id||"team";
}
ensureState();

const current=()=>state.weeks[state.activeWeek];
const selected=()=>state.members.find(m=>m.id===state.selectedId);
const personData=id=>current().people[id];

function save(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  $("saveStatus").textContent="已自动保存 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
 }catch(e){
  $("saveStatus").textContent="自动保存失败，请检查浏览器存储空间";
  notify("浏览器自动保存失败，请检查存储空间或清理缓存。");
 }
}
function notify(s){
 const e=$("toast");e.textContent=s;e.classList.add("show");
 clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.remove("show"),2500);
}
function field(label,html,wide=false){return `<div class="field ${wide?"wide":""}"><label>${label}</label>${html}</div>`}
function input(kind,id,prop,value,placeholder="",type="text",extra=""){
 return `<input data-kind="${kind}" data-id="${esc(id)}" data-prop="${prop}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}>`;
}
function area(kind,id,prop,value,placeholder="",rows=3){
 return `<textarea data-kind="${kind}" data-id="${esc(id)}" data-prop="${prop}" placeholder="${esc(placeholder)}" rows="${rows}">${esc(value)}</textarea>`;
}
function select(kind,id,prop,value,options){
 return `<select data-kind="${kind}" data-id="${esc(id)}" data-prop="${prop}">${options.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
}
function addButton(kind,label){return `<button class="small" data-action="add" data-kind="${kind}">＋ ${label}</button>`}
function pill(text,cls="neutral"){return `<span class="pill ${cls}">${esc(text)}</span>`}

function kpiStatus(k){
 const a=num(k.actual),t=num(k.target);
 if(a===null)return ["未填写","neutral"];
 if(t===null)return ["目标待确认","warn"];
 return (k.op==="lte"?a<=t:a>=t)?["达标","good"]:["未达标","bad"];
}
function taskStatus(s){
 return ({todo:["未开始","neutral"],ongoing:["进行中","warn"],review:["审核中","warn"],blocked:["受阻","bad"],done:["已完成","good"]})[s]||["未开始","neutral"];
}
function priorityOptions(){return [["high","高"],["medium","中"],["low","低"]]}
function countTasks(p){
 return {total:p.tasks.length,done:p.tasks.filter(t=>t.status==="done").length,active:p.tasks.filter(t=>["ongoing","review","blocked"].includes(t.status)).length};
}
function countOpenBlockers(p){return p.blockers.filter(b=>b.status!=="closed").length}

function renderTop(){
 $("weekInput").value=state.activeWeek;
 $("weekSelect").innerHTML=Object.keys(state.weeks).sort().reverse().map(w=>`<option value="${w}" ${w===state.activeWeek?"selected":""}>${w} — ${endOfWeek(w)}</option>`).join("");
 $("periodText").textContent=`统计周期：${state.activeWeek} 至 ${endOfWeek(state.activeWeek)} · 浏览器本地保存`;
 $("pageTitle").textContent=state.selectedId==="team"?"团队 KPI 与任务总览":"设计团队 KPI 与周任务管理";
}
function renderNav(){
 $("memberNav").innerHTML=state.members.map(m=>{
  const p=personData(m.id),filled=p.kpis.filter(k=>num(k.actual)!==null).length;
  return `<button class="${state.selectedId===m.id?"active":""}" data-action="person" data-id="${m.id}">
   <span class="avatar" style="background:${m.color}22;color:${m.color}">${esc(m.name.slice(0,2).toUpperCase())}</span>
   <span class="navtext"><strong>${esc(m.name)}</strong><small>${esc(m.role.split("/")[0].trim())}</small></span>
   <span class="navcount">${filled}/${p.kpis.length}</span>
  </button>`;
 }).join("")+`<button class="${state.selectedId==="team"?"active":""}" data-action="team"><span class="avatar">▦</span><span class="navtext"><strong>团队总览</strong><small>任务与 KPI 汇总</small></span></button>`;
}
function renderStats(){
 let totalK=0,filled=0,totalT=0,done=0,blocks=0,plans=0;
 state.members.forEach(m=>{
  const p=personData(m.id),t=countTasks(p);
  totalK+=p.kpis.length;filled+=p.kpis.filter(k=>num(k.actual)!==null).length;
  totalT+=t.total;done+=t.done;blocks+=countOpenBlockers(p);plans+=p.plans.length;
 });
 $("stats").innerHTML=[["已填写 KPI",`${filled}/${totalK}`],["已完成任务",`${done}/${totalT}`],["未解决卡点",blocks],["下周计划",plans]]
 .map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("");
}

function renderKPI(p){
 const weight=p.kpis.reduce((s,k)=>s+(Number(k.weight)||0),0);
 const filled=p.kpis.filter(k=>num(k.actual)!==null).length;
 const html=p.kpis.map(k=>{
  const [status,cls]=kpiStatus(k);
  const target=k.target===""?"待确认":`${k.op==="lte"?"≤":"≥"} ${k.target} ${k.unit}`;
  const actual=num(k.actual)===null?"—":`${k.actual} ${k.unit}`;
  return `<details class="metric">
   <summary>
    <span class="metricname">${esc(k.name)}</span>
    <span class="metric-target">${esc(target)}</span>
    <span class="metric-actual">${esc(actual)}</span>
    <span class="metric-status">${pill(status,cls)}</span>
   </summary>
   <div class="metricbody"><div class="grid">
    ${field("指标名称",input("kpi",k.id,"name",k.name,"指标名称"))}
    ${field("权重 (%)",input("kpi",k.id,"weight",k.weight,"","number",'min="0" max="100" step="1"'))}
    ${field("目标值",input("kpi",k.id,"target",k.target,"未确认时留空","number",'step="any"'))}
    ${field("考核方向",select("kpi",k.id,"op",k.op,[["gte","越高越好（≥）"],["lte","越低越好（≤）"]]))}
    ${field("实际值",input("kpi",k.id,"actual",k.actual,"没有真实数据请留空","number",'step="any"'))}
    ${field("单位",input("kpi",k.id,"unit",k.unit,"例如 %、张/工作日"))}
    ${field("考核目的",area("kpi",k.id,"comment",k.comment,"该 KPI 主要考核什么？",3),true)}
   </div><div style="text-align:right;margin-top:12px"><button class="danger small" data-action="delete" data-kind="kpi" data-id="${k.id}">删除该 KPI</button></div></div>
  </details>`;
 }).join("");

 return `<div class="sectionhead">
  <div><h3>01 · 个人定制 KPI</h3><p>每个人的 KPI 独立设置，只填写目标值、实际值、权重和考核目的。</p></div>
  ${addButton("kpi","新增个人 KPI")}
 </div>
 <div class="note">当前指标权重合计：${weight}% · 已填写实际值：${filled}/${p.kpis.length} 项。实际值未统计时请留空，不要填入估算数字。</div>
 <div class="progress"><span style="width:${Math.round(filled/Math.max(1,p.kpis.length)*100)}%"></span></div>
 ${html||'<div class="placeholder">尚未设置个人 KPI。点击“新增个人 KPI”添加。</div>'}`;
}

function renderTask(t){
 const [label,cls]=taskStatus(t.status);
 return `<details class="record"><summary><span class="recordtitle">${esc(t.title||"未命名任务")}</span>${pill(label,cls)}<span class="muted">${esc(t.due||"未定日期")}</span></summary>
 <div class="recordbody"><div class="grid">
 ${field("未完成任务名称",input("task",t.id,"title",t.title,"填写尚未完成的任务"))}
 ${field("目前状态",select("task",t.id,"status",t.status,[["todo","未开始"],["ongoing","进行中"],["review","审核中"],["blocked","受阻"],["done","已完成"]]))}
 ${field("工作复杂度",select("task",t.id,"complexity",t.complexity,[["low","低"],["medium","中"],["high","高"],["veryhigh","很高"]]))}
 ${field("预计完成日期",input("task",t.id,"due",t.due,"","date"))}
 ${field("目前进度 / 已完成部分",area("task",t.id,"result",t.result,"说明已经完成的部分、当前阶段及剩余工作"),true)}
 ${field("剩余工作 / 验收标准",area("task",t.id,"acceptance",t.acceptance,"还需要完成什么？怎样才算完成？"),true)}
 ${field("卡点 / 下一步行动",area("task",t.id,"notes",t.notes,"待审核、修改意见、依赖条件或下一步"),true)}
 ${field("ClickUp / 文件链接",input("task",t.id,"link",t.link,"任务链接或文件链接"),true)}
 </div><div style="text-align:right;margin-top:10px"><button class="danger small" data-action="delete" data-kind="task" data-id="${t.id}">删除任务</button></div></div></details>`;
}
function renderBlocker(b){
 return `<details class="record"><summary><span class="recordtitle">${esc(b.title||"未命名卡点")}</span>${pill(b.status==="closed"?"已解决":b.status==="inprogress"?"处理中":"待处理",b.status==="closed"?"good":b.status==="inprogress"?"warn":"bad")}</summary>
 <div class="recordbody"><div class="grid">
 ${field("问题 / 卡点",input("blocker",b.id,"title",b.title,"清晰描述问题"))}
 ${field("状态",select("blocker",b.id,"status",b.status,[["open","待处理"],["inprogress","处理中"],["closed","已解决"]]))}
 ${field("优先级",select("blocker",b.id,"priority",b.priority,priorityOptions()))}
 ${field("责任人 / 需要谁支持",input("blocker",b.id,"owner",b.owner,"填写具体姓名"))}
 ${field("预计解决日期",input("blocker",b.id,"due",b.due,"","date"))}
 ${field("业务影响 / 风险",area("blocker",b.id,"impact",b.impact,"影响哪些交付或业务？"),true)}
 ${field("解决措施 / 已采取行动",area("blocker",b.id,"action",b.action,"下一步、升级路径或所需支持"),true)}
 </div><div style="text-align:right;margin-top:10px"><button class="danger small" data-action="delete" data-kind="blocker" data-id="${b.id}">删除卡点</button></div></div></details>`;
}
function renderPlan(p){
 return `<details class="record"><summary><span class="recordtitle">${esc(p.title||"未命名计划")}</span>${pill(({high:"高优先级",medium:"中优先级",low:"低优先级"})[p.priority]||"中优先级",p.priority==="high"?"bad":p.priority==="low"?"good":"warn")}<span class="muted">${esc(p.due||"待定")}</span></summary>
 <div class="recordbody"><div class="grid">
 ${field("任务 / 项目名称",input("plan",p.id,"title",p.title,"具体任务名称"))}
 ${field("优先级",select("plan",p.id,"priority",p.priority,priorityOptions()))}
 ${field("截止日期",input("plan",p.id,"due",p.due,"","date"))}
 ${field("负责人（Responsible）",input("plan",p.id,"owner",p.owner,"实际执行人姓名"))}
 ${field("最终拍板人（Accountable）",input("plan",p.id,"accountable",p.accountable,"最终负责人姓名"))}
 ${field("预期成果 / 验收标准",area("plan",p.id,"deliverable",p.deliverable,"下周要交付什么，如何验收？"),true)}
 ${field("依赖条件 / 备注",area("plan",p.id,"notes",p.notes,"Brief、素材、审核、开发等依赖"),true)}
 </div><div style="text-align:right;margin-top:10px"><button class="danger small" data-action="delete" data-kind="plan" data-id="${p.id}">删除计划</button></div></div></details>`;
}

function renderPerson(){
 const m=selected();if(!m)return;
 const p=personData(m.id),t=countTasks(p);
 const unfinished=p.tasks.filter(x=>x.status!=="done");
 $("personView").classList.remove("hidden");$("teamViewPanel").classList.add("hidden");
 $("personView").innerHTML=`
 <section class="card"><div class="hero">
 <span class="avatar" style="width:58px;height:58px;background:${m.color}22;color:${m.color};font-size:20px">${esc(m.name.slice(0,2).toUpperCase())}</span>
 <div class="info"><h2>${esc(m.name)}</h2><p>${esc(m.role)}</p><p class="hero desc">${esc(m.desc||"")}</p></div>
 <button data-action="edit-member">编辑人员</button>
 </div><div class="pills">
 ${pill("已填写 KPI "+p.kpis.filter(k=>num(k.actual)!==null).length+"/"+p.kpis.length)}
 ${pill("未完成任务 "+unfinished.length,"warn")}
 ${pill("已完成任务 "+t.done,"good")}
 ${pill("未解决卡点 "+countOpenBlockers(p),countOpenBlockers(p)?"bad":"neutral")}

 ${t.done?`<p class="muted">另有 ${t.done} 项任务已标记完成，已从未完成任务列表中隐藏。</p>`:""}

 </section>
 <section class="card"><div class="sectionhead"><div><h3>04 · 下周工作计划</h3><p>明确成果、负责人及截止日期。</p></div>${addButton("plan","新增计划")}</div>
 ${p.plans.map(renderPlan).join("")||'<div class="placeholder">尚未录入下周计划。</div>'}

function renderTeam(){
 $("personView").classList.add("hidden");$("teamViewPanel").classList.remove("hidden");
 const rows=state.members.map(m=>{
  const p=personData(m.id),t=countTasks(p);
  return `<tr data-person="${m.id}"><td><strong>${esc(m.name)}</strong><br><span class="muted">${esc(m.role)}</span></td>

  <td>${countOpenBlockers(p)}</td><td>${p.plans.length}</td></tr>`;
 }).join("");
 $("teamViewPanel").innerHTML=`
 <section class="card"><div class="sectionhead"><div><h3>团队 KPI 与任务总览</h3><p>汇总当前周实际录入的数据。点击成员行查看详细记录。</p></div></div>
 <div style="overflow:auto"><table><thead><tr><th>成员 / 岗位</th><th>已填写 KPI</th><th>未完成任务</th><th>已完成</th><th>进行中</th><th>未解决卡点</th><th>下周计划</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <section class="card"><div class="sectionhead"><div><h3>部门风险与管理事项</h3><p>记录团队整体风险、资源安排和跨部门依赖。</p></div></div>
 ${area("team","team","teamNotes",current().teamNotes,"团队整体风险、资源安排及跨部门依赖",5)}</section>`;
}
function render(){
 /* 重新渲染前先记住哪些折叠记录是展开的，以及当前正在编辑的输入框。
    否则下拉框 / 日期一变化就整个重建 DOM，已展开的记录会被强制收起。 */
 const openRecords=[...document.querySelectorAll("details[open]")].map(d=>{
  const f=d.querySelector("[data-kind][data-id]");
  return f?`${f.dataset.kind}:${f.dataset.id}`:"";
 }).filter(Boolean);
 const active=document.activeElement;
 const focusInfo=active&&active.dataset&&active.dataset.kind&&active.dataset.prop
  ?{kind:active.dataset.kind,id:active.dataset.id||"",prop:active.dataset.prop,start:active.selectionStart,end:active.selectionEnd}
  :null;

 renderTop();renderNav();renderStats();
 if(state.selectedId==="team")renderTeam();else renderPerson();

 if(openRecords.length){
  document.querySelectorAll("details").forEach(d=>{
   const f=d.querySelector("[data-kind][data-id]");
   if(f&&openRecords.includes(`${f.dataset.kind}:${f.dataset.id}`))d.open=true;
  });
 }
 if(focusInfo){
  const el=document.querySelector(`[data-kind="${focusInfo.kind}"][data-id="${focusInfo.id}"][data-prop="${focusInfo.prop}"]`);
  if(el){
   el.focus({preventScroll:true});
   if(typeof el.setSelectionRange==="function"&&focusInfo.start!=null){
    try{el.setSelectionRange(focusInfo.start,focusInfo.end)}catch(_){}
   }
  }
 }
}

function addRecord(kind){
 const p=personData(state.selectedId);if(!p)return;
 if(kind==="kpi")p.kpis.push({id:uid(),name:"新 KPI 指标",target:"",unit:"%",weight:0,op:"gte",actual:"",comment:""});
 if(kind==="task")p.tasks.push({id:uid(),title:"",status:"todo",complexity:"medium",due:"",result:"",acceptance:"",notes:"",link:""});
 if(kind==="blocker")p.blockers.push({id:uid(),title:"",status:"open",priority:"medium",owner:"",due:"",impact:"",action:""});
 if(kind==="plan")p.plans.push({id:uid(),title:"",priority:"medium",due:"",owner:selected()?.name||"",accountable:"",deliverable:"",notes:""});
 save();render();notify("已新增记录");
}
function updateRecord(el){
 const kind=el.dataset.kind,id=el.dataset.id,prop=el.dataset.prop;
 if(!kind||!prop)return;
 let target;
 if(kind==="team")target=current();
 else{
  const p=personData(state.selectedId);if(!p)return;
  const list=kind==="kpi"?p.kpis:kind==="task"?p.tasks:kind==="blocker"?p.blockers:p.plans;
  target=list.find(x=>x.id===id);
 }
 if(!target)return;
 target[prop]=el.value;
 save();
}

/* 修复：KPI 输入框的值已保存，但原来的代码没有刷新折叠标题。
   现在 KPI 字段触发 change 后会重新渲染，标题、状态、侧边栏和统计数字同步更新。 */
document.addEventListener("input",e=>{
 if(e.target.matches("[data-kind][data-prop]"))updateRecord(e.target);
});
document.addEventListener("change",e=>{
 if(!e.target.matches("[data-kind][data-prop]"))return;
 updateRecord(e.target);
 if(e.target.dataset.kind==="kpi"||e.target.tagName==="SELECT"||e.target.type==="date")render();
});

function editMember(){
 const m=selected();if(!m)return;
 const host=document.createElement("div");host.className="card";
 host.innerHTML=`<h3 style="margin-bottom:12px">编辑人员信息</h3><div class="grid">
 ${field("姓名",'<input id="editName" value="'+esc(m.name)+'">')}
 ${field("岗位",'<input id="editRole" value="'+esc(m.role)+'">')}

function reportKPI(k, i) {

    k.target === "" || k.target == null
      ? "待确认"
      : `${k.op === "lte" ? "≤" : "≥"} ${k.target}${k.unit === "%" ? "%" : k.unit ? " " + k.unit : ""}`;

  const actual =
    num(k.actual) === null
      ? "未填写"
      : `${k.actual}${k.unit === "%" ? "%" : k.unit ? " " + k.unit : ""}`;

  return `
    <article class="r-kpi">
      <div class="r-kpi-top">

      </div>

      <div class="r-kpi-data">
        <div class="r-kpi-target">
          <span>目标值</span>
          <strong>${esc(target)}</strong>
        </div>

        <div class="r-kpi-actual">
          <span>实际值</span>
          <strong class="${num(k.actual) === null ? "unfilled" : ""}">
            ${esc(actual)}
          </strong>
        </div>

        <div class="r-kpi-weight">
          <span>权重</span>
          <strong>${esc(k.weight)}<small>%</small></strong>
        </div>
      </div>

      ${
        k.comment && String(k.comment).trim()
          ? `
            <div class="r-comment">
              <span>考核目的</span>
              <p>${reportText(k.comment)}</p>
            </div>
          `
          : ""
      }
    </article>
  `;
}

<body>
<header class="hero">
  <div class="hero-inner">
    <div class="topline">
      <div class="brand">
        AFTER<span class="brand-accent">SHOCK</span>
        <span class="brand-sub">DESIGN DEPARTMENT</span>
      </div>

      <div class="report-status ${dataComplete ? "complete" : ""}">
        <span class="status-dot"></span>
        ${dataComplete ? "KPI DATA COMPLETE" : "DATA PENDING"}
      </div>
    </div>

    <div class="hero-main">
      <div class="hero-copy">
        <div class="eyebrow">WEEKLY PERFORMANCE REPORT</div>
        <h1>设计团队周报</h1>
        <p class="hero-description">
          个人 KPI 表现、未完成任务及进度、卡点与现存问题、下周工作计划。
        </p>
      </div>

      <div class="period-card">
        <span>REPORTING PERIOD</span>
        <strong>${esc(week)}</strong>
        <small>至 ${esc(endOfWeek(week))} · 共 ${members.length} 位成员</small>
      </div>
    </div>

    <div class="hero-stats">
      <div class="hero-stat">
        <span>团队成员</span>
        <strong>${members.length}</strong>
        <small>当前报告覆盖人员</small>
      </div>

      <div class="hero-stat primary-stat">
        <span>KPI 实际值已填写</span>
        <strong>${filledKpis}<small style="font-size:17px;color:#8c9aac"> / ${totalKpis}</small></strong>
        <small>以已录入的实际数值为准</small>
      </div>

      <div class="hero-stat">
        <span>已录入任务</span>
        <strong>${totalTasks}</strong>
        <small>已完成及未完成任务记录</small>
      </div>

      <div class="hero-stat warning-stat">
        <span>未解决卡点</span>
        <strong>${openBlocks}</strong>
        <small>待处理及处理中</small>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc">
    <div class="toc-heading">REPORT NAVIGATION</div>
    <div class="toc-links">
      <a href="#overview">
        <span class="nav-dot" style="background:#cf263c"></span>
        团队执行总览
      </a>
    </div>

    <div class="toc-divider"></div>
    <div class="toc-heading">TEAM MEMBERS</div>
    <div class="toc-links">${nav}</div>

    <div class="toc-divider"></div>
    <div class="toc-links">
      <a href="#team-notes">
        <span class="nav-dot" style="background:#7f8b9a"></span>
        团队整体备注
      </a>
    </div>
  </aside>

  <main class="content">
    <section id="overview">
      <div class="overview-heading">
        <div>
          <h2>团队执行总览</h2>
          <p>先查看整体数据完整度，再查看每位成员的具体工作和问题。</p>
        </div>
        <span class="overview-tag">WEEKLY SUMMARY</span>
      </div>

      <div class="data-alert ${dataComplete ? "complete" : ""}">
        <div class="alert-icon">${dataComplete ? "✓" : "!"}</div>
        <div class="alert-content">
          <strong>${dataComplete ? "KPI 实际值已全部填写" : "本周报告仍有信息待补充"}</strong>
          <p>
            ${
              dataComplete
                ? "所有已配置 KPI 均已录入实际值。"
                : `当前已配置 ${totalKpis} 项 KPI，已填写实际值 ${filledKpis} 项；另有 ${unfinishedTasks} 项未完成任务记录、${blockerCount} 项卡点记录及 ${planCount} 项下周计划记录。空白不代表相关工作或问题不存在，请结合实际情况补充。`
            }
          </p>
        </div>
      </div>

      <div class="overview-grid">
        <div class="overview-card">
          <span class="metric-label">KPI 实际值填写率</span>
          <strong>${completionRate}%</strong>
          <small>${filledKpis} / ${totalKpis} 项已填写</small>
          <div class="mini-progress">
            <span style="width:${completionRate}%"></span>
          </div>
        </div>

        <div class="overview-card">
          <span class="metric-label">未完成任务记录</span>
          <strong>${unfinishedTasks}</strong>
          <small>当前导出数据中的未完成事项</small>
        </div>

        <div class="overview-card">
          <span class="metric-label">已完成任务记录</span>
          <strong>${doneTasks}</strong>
          <small>已明确标记为完成</small>
        </div>

        <div class="overview-card">
          <span class="metric-label">下周工作计划</span>
          <strong>${planCount}</strong>
          <small>全团队已录入的计划</small>
        </div>
      </div>

      <div class="summary-panel">
        <div class="panel-heading">
          <div>
            <h3>成员工作状态一览</h3>
            <p>快速定位 KPI 未填写、任务待推进及尚未解决的卡点。</p>
          </div>
          <span class="overview-tag">TEAM STATUS</span>
        </div>

        <div class="summary-table-wrap">
          <table class="summary-table">
            <thead>
              <tr>
                <th>成员 / 岗位</th>
                <th>KPI 实际值</th>
                <th>未完成任务</th>
                <th>已完成任务</th>
                <th>未解决卡点</th>
                <th>下周计划</th>
              </tr>
            </thead>
            <tbody>${memberRows}</tbody>
          </table>
        </div>
      </div>
    </section>

    ${sections}

    <section class="team-notes" id="team-notes">
      <div class="eyebrow">TEAM-WIDE NOTES</div>
      <h2>团队整体备注、风险与资源需求</h2>
      <div class="team-notes-content">${reportText(current().teamNotes)}</div>
    </section>
  </main>
</div>

<footer class="footer">
  <p>AFTERSHOCK PC · Design Department · ${esc(week)} 至 ${esc(endOfWeek(week))}</p>
  <p>本报告根据管理工具中已录入的信息生成。未填写的数据不会被推测或自动补齐。</p>
</footer>

<script>
document.querySelectorAll(".toc a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll(".toc a").forEach(item => {
      item.classList.remove("active");
    });
    link.classList.add("active");
  });
});
<\/script>
<\/body>
<\/html>`;
}

function exportVisualHTMLReport(){
 save();downloadBlob(new Blob(["\ufeff",buildVisualHTMLReport()],{type:"text/html;charset=utf-8"}),`AFTERSHOCK_Design_Team_Visual_Report_${state.activeWeek}.html`);
 notify("可视化网页报告已导出，可直接用浏览器打开");
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");
 if(b){
  const a=b.dataset.action;
  if(a==="person"){state.selectedId=b.dataset.id;save();render();}
  if(a==="team"){state.selectedId="team";save();render();}
  if(a==="add")addRecord(b.dataset.kind);
  if(a==="delete")deleteRecord(b.dataset.kind,b.dataset.id);
  if(a==="edit-member")editMember();
 }
 const row=e.target.closest("tr[data-person]");
 if(row){state.selectedId=row.dataset.person;save();render();}
});

function deleteRecord(kind,id){
 const p=personData(state.selectedId);if(!p)return;
 const list=kind==="kpi"?p.kpis:kind==="task"?p.tasks:kind==="blocker"?p.blockers:p.plans;
 const item=list.find(x=>x.id===id);if(!item)return;
 if(!confirm(`确定删除「${item.name||item.title||item.id}」吗？`))return;
 list.splice(list.indexOf(item),1);save();render();
}
function editMember(){
 const m=selected();if(!m)return;
 const host=document.createElement("div");host.className="card";
 host.innerHTML=`<h3 style="margin-bottom:12px">编辑人员信息</h3><div class="grid">
 ${field("姓名",'<input id="editName" value="'+esc(m.name)+'">')}
 ${field("岗位",'<input id="editRole" value="'+esc(m.role)+'">')}
 ${field("工作职责",'<textarea id="editDesc">'+esc(m.desc||"")+'</textarea>',true)}
 </div><div style="display:flex;gap:8px;margin-top:12px"><button class="primary" id="saveMember">保存</button><button id="cancelMember">取消</button></div>`;
 $("personView").prepend(host);
 $("cancelMember").onclick=()=>host.remove();
 $("saveMember").onclick=()=>{
  const name=$("editName").value.trim();if(!name){notify("姓名不能为空");return;}
  m.name=name;m.role=$("editRole").value.trim();m.desc=$("editDesc").value.trim();save();render();
 };
}
function addMember(){
 const name=prompt("请输入成员姓名：");if(!name||!name.trim())return;
 const role=prompt("请输入岗位名称：")||"Design Team Member";
 const desc=prompt("请输入主要工作职责：")||"",id=uid();
 const m={id,name:name.trim(),role,desc,color:COLORS[state.members.length%COLORS.length],kpis:[]};
 state.members.push(m);
 Object.values(state.weeks).forEach(w=>w.people[id]={kpis:[],tasks:[],blockers:[],plans:[]});
 state.selectedId=id;save();render();
}
function switchWeek(value,ask=true){
 const w=monday(value);
 if(!state.weeks[w]){
  const people={};
  state.members.forEach(m=>{const profile=PROFILES.find(x=>x.id===m.id);people[m.id]={kpis:(profile?profile.kpis:[]).map(createKPI),tasks:[],blockers:[],plans:[]};});
  if(ask&&confirm("是否结转上一周未完成的任务和未解决卡点？")){
   state.members.forEach(m=>{
    const old=personData(m.id);if(!old)return;
    people[m.id].tasks=old.tasks.filter(t=>t.status!=="done").map(t=>({...t,id:uid(),result:"",notes:`从 ${state.activeWeek} 结转：${t.notes||"请重新确认进度"}`}));
    people[m.id].blockers=old.blockers.filter(b=>b.status!=="closed").map(b=>({...b,id:uid()}));
   });
  }
  state.weeks[w]={people,teamNotes:"",createdAt:new Date().toISOString()};
 }
 state.activeWeek=w;ensureState();save();render();
}

$("weekInput").addEventListener("change",e=>{if(e.target.value)switchWeek(e.target.value,true)});
$("weekSelect").addEventListener("change",e=>switchWeek(e.target.value,false));
$("newWeek").onclick=()=>switchWeek(nextWeek(state.activeWeek),true);
$("teamView").onclick=()=>{state.selectedId="team";save();render()};
$("addMember").onclick=addMember;
$("exportDoc").onclick=exportFullWordDocument;
$("exportHtml").onclick=exportVisualHTMLReport;
$("printPage").onclick=()=>window.print();

render();
save();
})();
</script>
</body>
</html>
