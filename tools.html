<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证据搜索 - 听风阁</title>
    <style>
        /* ==================== 基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #0f0f12;
            color: #e8e6e1;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ==================== 头部 ==================== */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #c0392b;
        }

        .header h1 {
            font-size: 2rem;
            color: #c0392b;
            letter-spacing: 4px;
        }

        /* ==================== 导航栏 ==================== */
        .navbar {
            background: #1a1a2e;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-link {
            padding: 8px 20px;
            background: #16213e;
            border: 1px solid #333;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-link:hover, .nav-link.active {
            background: #c0392b;
            border-color: #c0392b;
        }

        /* ==================== 主容器 ==================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ==================== 阶段显示区 ==================== */
        .phase-display {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #c0392b;
            text-align: center;
        }

        .phase-display h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .phase-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .phase-badge.phase1 {
            background: rgba(41, 128, 185, 0.2);
            border: 2px solid #2980b9;
            color: #2980b9;
        }

        .phase-badge.phase2 {
            background: rgba(212, 172, 13, 0.2);
            border: 2px solid #d4ac0d;
            color: #d4ac0d;
        }

        .phase-badge.phase3 {
            background: rgba(192, 57, 43, 0.2);
            border: 2px solid #c0392b;
            color: #c0392b;
        }

        .phase-badge.waiting {
            background: rgba(136, 136, 136, 0.2);
            border: 2px solid #888;
            color: #888;
        }

        /* ==================== 地点列表 ==================== */
        .locations-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            color: #c0392b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c0392b;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .location-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .location-card:hover {
            transform: translateY(-5px);
            border-color: #c0392b;
            box-shadow: 0 5px 20px rgba(192, 57, 43, 0.3);
        }

        .location-card.searched {
            border-color: #27ae60;
            opacity: 0.7;
        }

        .location-card.searched::after {
            content: "已搜索";
            position: absolute;
            top: 10px;
            right: 10px;
            background: #27ae60;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .location-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .location-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .location-desc {
            font-size: 0.85rem;
            color: #888;
        }

        /* ==================== 线索弹窗 ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #c0392b;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #c0392b;
        }

        .modal-title {
            font-size: 1.3rem;
            color: #c0392b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .clue-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .clue-item {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #c0392b;
            transition: all 0.3s ease;
        }

        .clue-item:hover {
            transform: translateX(5px);
        }

        .clue-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clue-id {
            font-size: 0.9rem;
            color: #c0392b;
            font-weight: bold;
        }

        .clue-status {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .clue-status.unlocked {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .clue-status.locked {
            background: rgba(136, 136, 136, 0.2);
            color: #888;
        }

        .clue-text {
            color: #ccc;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .clue-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #c0392b;
            color: #fff;
        }

        .btn-primary:hover {
            background: #a93226;
        }

        .btn-secondary {
            background: #16213e;
            color: #888;
            border: 1px solid #333;
        }

        .btn-secondary:hover {
            background: #333;
        }

        .btn-success {
            background: #27ae60;
            color: #fff;
        }

        .btn-success:hover {
            background: #229954;
        }

        /* ==================== 我的线索记录 ==================== */
        .my-clues-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .my-clues-section h2 {
            color: #c0392b;
            margin-bottom: 20px;
        }

        .my-clues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .my-clue-card {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #c0392b;
            transition: transform 0.3s ease;
        }

        .my-clue-card:hover {
            transform: translateX(5px);
        }

        .my-clue-id {
            font-size: 0.8rem;
            color: #c0392b;
            margin-bottom: 5px;
        }

        .my-clue-content {
            font-size: 0.95rem;
            color: #ccc;
        }

        .no-clues {
            text-align: center;
            color: #555;
            padding: 40px;
            font-style: italic;
        }

        /* ==================== 提示信息 ==================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #c0392b;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 768px) {
            .locations-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <h1>听风阁 - 证据搜索</h1>
    </header>

    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="nav-link">首页</a>
        <a href="player-shenmingxuan.html" class="nav-link">沈明轩</a>
        <a href="player-shenmingyue.html" class="nav-link">沈明月</a>
        <a href="player-zhaotiancheng.html" class="nav-link">赵天成</a>
        <a href="player-linyuwei.html" class="nav-link">林雨薇</a>
        <a href="player-chenzhiyuan.html" class="nav-link">陈志远</a>

    </nav>

    <!-- 主内容 -->
    <div class="container">
        <!-- 阶段显示区 -->
        <div class="phase-display">
            <h2>当前游戏阶段</h2>
            <div class="phase-badge waiting" id="phaseBadge">等待开始</div>
            <p style="color: #888; margin-top: 10px;" id="phaseDesc">请等待DM开始游戏</p>
        </div>

        <!-- 可搜索地点 -->
        <div class="locations-section">
            <h2 class="section-title">可搜索地点</h2>
            <div class="locations-grid" id="locationsGrid">
                <!-- 地点卡片将由JavaScript动态生成 -->
            </div>
        </div>

        <!-- 我的线索记录 -->
        <div class="my-clues-section">
            <h2>我的线索记录</h2>
            <div id="myClues" class="my-clues-grid">
                <div class="no-clues">暂无记录的线索，点击地点进行搜索</div>
            </div>
        </div>
    </div>

    <!-- 线索弹窗 -->
    <div class="modal-overlay" id="clueModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 class="modal-title" id="modalTitle">地点名称</h3>
            <div class="clue-list" id="clueList">
                <!-- 线索列表将由JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 线索数据 ====================
        const cluesData = {
            phase1: {
                '客厅': [
                    { id: 'A11', content: '走廊监控显示21:25沈明轩进入书房，21:58离开' },
                    { id: 'A15', content: '别墅三层平面图' },
                    { id: 'A16', content: '天气预报显示暴风雨封路' }
                ],
                '餐厅': [
                    { id: 'A10', content: '沈伯渊日记最后一页提到"小雨走了，第二十个年头"' },
                    { id: 'A12', content: '书房茶杯残留高浓度安眠药，有林雨薇指纹' },
                    { id: 'A17', content: '沈伯渊病历显示不明原因体重下降' }
                ],
                '厨房': [
                    { id: 'A06', content: '陈志远房间铁盒里的照片（小雨，6岁）和剪报碎片' },
                    { id: 'A07', content: '苏小曼钱包里的《财经周刊》记者证' },
                    { id: 'A08', content: '周海医药箱里的两瓶药粉和用药记录' }
                ]
            },
            phase2: {
                '书房': [
                    { id: 'A01', content: '沈伯渊书房的遗嘱草稿，显示股份分配，有林雨薇的指甲划痕' },
                    { id: 'A02', content: '沈明轩笔记本电脑里的5000万资金转出记录' },
                    { id: 'B09', content: '书房地毯上的喷射状血迹' },
                    { id: 'B10', content: '钢笔笔尖的微量血迹' }
                ],
                '主卧': [
                    { id: 'A05', content: '林雨薇备用手机里的暧昧短信' },
                    { id: 'B04', content: '林雨薇安眠药瓶少了两片' },
                    { id: 'A14', content: '林雨薇珠宝盒里的钻石项链（M&Y刻字）' }
                ],
                '次卧A': [
                    { id: 'A13', content: '沈明轩手机里的高利贷催债短信' },
                    { id: 'B01', content: '沈明轩西装袖口的墨水痕迹' }
                ],
                '次卧B': [
                    { id: 'A03', content: '沈明月行李箱底层的旧信，提到"明月是你的女儿"' },
                    { id: 'B02', content: '沈明月录音笔录下的争吵声和呻吟声' }
                ],
                '管家房': [
                    { id: 'B05', content: '陈志远围裙上的AB型血迹' },
                    { id: 'B06', content: '苏小曼笔记本的调查记录' }
                ]
            },
            phase3: {
                '客房A': [
                    { id: 'C05', content: '沈明月DNA检测报告（与赵天成亲子关系99.97%）' },
                    { id: 'C06', content: '赵天成相册里的旧照片（与秀婷和明月）' }
                ],
                '客房B': [
                    { id: 'C07', content: '苏小曼的完整调查报告' },
                    { id: 'C08', content: '周海家人的资助协议' }
                ],
                '客房C': [
                    { id: 'C09', content: '沈明轩和林雨薇的密谋信件' },
                    { id: 'B03', content: '赵天成窃听器录音' }
                ],
                '储藏室': [
                    { id: 'C01', content: '陈志远身份伪造，真实身份陈建国' },
                    { id: 'C02', content: '2006年6月21日报纸剪报' },
                    { id: 'C03', content: '保险柜中的赔偿清单和保密协议' },
                    { id: 'C04', content: '张秀兰（陈建国妻子）的死亡证明' }
                ],
                '露台': [
                    { id: 'B11', content: '走廊地毯的茶水渍和茶杯碎片' },
                    { id: 'B12', content: '别墅门窗都从内部反锁' },
                    { id: 'C10', content: '钢笔上的陈志远指纹' },
                    { id: 'C11', content: '沈伯渊真正死因报告（颈动脉刺破）' },
                    { id: 'C12', content: '陈志远茶杯里的安眠药成分' }
                ]
            }
        };

        // ==================== 地点图标映射 ====================
        const locationIcons = {
            '客厅': '🛋️',
            '餐厅': '🍽️',
            '厨房': '🍳',
            '书房': '📚',
            '主卧': '🛏️',
            '次卧A': '🛏️',
            '次卧B': '🛏️',
            '管家房': '🚪',
            '客房A': '🛏️',
            '客房B': '🛏️',
            '客房C': '🛏️',
            '储藏室': '📦',
            '露台': '🌙'
        };

        // ==================== 当前玩家角色 ====================
        // 从URL参数或localStorage获取当前角色
        function getCurrentRole() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('role') || localStorage.getItem('currentRole') || 'shenmingxuan';
        }

        // ==================== 更新阶段显示 ====================
        function updatePhaseDisplay() {
            const currentPhase = parseInt(localStorage.getItem('currentPhase') || '0');
            const badge = document.getElementById('phaseBadge');
            const desc = document.getElementById('phaseDesc');

            const phaseInfo = {
                0: { text: '等待开始', class: 'waiting', desc: '请等待DM开始游戏' },
                1: { text: '第一阶段', class: 'phase1', desc: '可搜索：客厅、餐厅、厨房' },
                2: { text: '第二阶段', class: 'phase2', desc: '可搜索：书房、主卧、次卧A、次卧B、管家房' },
                3: { text: '第三阶段', class: 'phase3', desc: '可搜索：客房A、客房B、客房C、储藏室、露台' }
            };

            const info = phaseInfo[currentPhase] || phaseInfo[0];
            badge.textContent = info.text;
            badge.className = 'phase-badge ' + info.class;
            desc.textContent = info.desc;

            // 更新可搜索地点
            updateLocations(currentPhase);
        }

        // ==================== 更新地点列表 ====================
        function updateLocations(phase) {
            const grid = document.getElementById('locationsGrid');
            const searchedLocations = JSON.parse(localStorage.getItem('searchedLocations') || '[]');

            let locations = [];
            if (phase === 1) {
                locations = ['客厅', '餐厅', '厨房'];
            } else if (phase === 2) {
                locations = ['书房', '主卧', '次卧A', '次卧B', '管家房'];
            } else if (phase === 3) {
                locations = ['客房A', '客房B', '客房C', '储藏室', '露台'];
            }

            if (locations.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">游戏尚未开始，请等待DM开启第一阶段</div>';
                return;
            }

            grid.innerHTML = locations.map(loc => {
                const isSearched = searchedLocations.includes(loc);
                return `
                    <div class="location-card ${isSearched ? 'searched' : ''}" onclick="openLocation('${loc}')">
                        <div class="location-icon">${locationIcons[loc] || '📍'}</div>
                        <div class="location-name">${loc}</div>
                        <div class="location-desc">点击搜索线索</div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 打开地点线索弹窗 ====================
        function openLocation(locationName) {
            const currentPhase = parseInt(localStorage.getItem('currentPhase') || '0');
            const phaseKey = 'phase' + currentPhase;
            const clues = cluesData[phaseKey]?.[locationName] || [];
            const unlockedClues = JSON.parse(localStorage.getItem('unlockedClues') || '[]');

            document.getElementById('modalTitle').textContent = locationName + ' - 线索';
            const clueList = document.getElementById('clueList');

            if (clues.length === 0) {
                clueList.innerHTML = '<div class="no-clues">该地点暂无线索</div>';
            } else {
                clueList.innerHTML = clues.map(clue => {
                    const isUnlocked = unlockedClues.includes(clue.id);
                    return `
                        <div class="clue-item">
                            <div class="clue-item-header">
                                <span class="clue-id">${clue.id}</span>
                                <span class="clue-status ${isUnlocked ? 'unlocked' : 'locked'}">
                                    ${isUnlocked ? '已发放' : '未发放'}
                                </span>
                            </div>
                            <div class="clue-text">${clue.content}</div>
                            <div class="clue-actions">
                                ${isUnlocked ? `
                                    <button class="btn btn-success" onclick="recordClue('${clue.id}', '${clue.content.replace(/'/g, "\\'")}')">
                                        记录线索
                                    </button>
                                ` : `
                                    <button class="btn btn-secondary" disabled>等待DM发放</button>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('clueModal').classList.add('active');

            // 标记为已搜索
            const searchedLocations = JSON.parse(localStorage.getItem('searchedLocations') || '[]');
            if (!searchedLocations.includes(locationName)) {
                searchedLocations.push(locationName);
                localStorage.setItem('searchedLocations', JSON.stringify(searchedLocations));
                updateLocations(currentPhase);
            }
        }

        // ==================== 关闭弹窗 ====================
        function closeModal() {
            document.getElementById('clueModal').classList.remove('active');
        }

        // ==================== 记录线索 ====================
        function recordClue(clueId, clueContent) {
            const currentRole = getCurrentRole();
            const myClues = JSON.parse(localStorage.getItem('playerClues_' + currentRole) || '[]');

            // 检查是否已记录
            if (myClues.some(c => c.id === clueId)) {
                showToast('该线索已记录');
                return;
            }

            myClues.push({ id: clueId, content: clueContent });
            localStorage.setItem('playerClues_' + currentRole, JSON.stringify(myClues));

            showToast('线索已记录');
            loadMyClues();
        }

        // ==================== 加载我的线索 ====================
        function loadMyClues() {
            const currentRole = getCurrentRole();
            const myClues = JSON.parse(localStorage.getItem('playerClues_' + currentRole) || '[]');
            const container = document.getElementById('myClues');

            if (myClues.length === 0) {
                container.innerHTML = '<div class="no-clues">暂无记录的线索，点击地点进行搜索</div>';
                return;
            }

            container.innerHTML = myClues.map(clue => `
                <div class="my-clue-card">
                    <div class="my-clue-id">${clue.id}</div>
                    <div class="my-clue-content">${clue.content}</div>
                </div>
            `).join('');
        }

        // ==================== 显示提示 ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ==================== 点击遮罩关闭弹窗 ====================
        document.getElementById('clueModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ==================== 初始化 ====================
        updatePhaseDisplay();
        loadMyClues();

        // 监听阶段变化
        window.addEventListener('storage', function(e) {
            if (e.key === 'currentPhase') {
                updatePhaseDisplay();
            }
        });

        // 定时检查
        setInterval(updatePhaseDisplay, 3000);
    </script>
</body>
</html>
