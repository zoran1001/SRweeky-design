<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>证据搜索 - 听风阁</title>
    <style>
        /* ==================== 基础样式 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #0f0f12;
            color: #e8e6e1;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ==================== 头部 ==================== */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #c0392b;
        }

        .header h1 {
            font-size: 2rem;
            color: #c0392b;
            letter-spacing: 4px;
        }

        /* ==================== 导航栏 ==================== */
        .navbar {
            background: #1a1a2e;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-link {
            padding: 8px 20px;
            background: #16213e;
            border: 1px solid #333;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-link:hover, .nav-link.active {
            background: #c0392b;
            border-color: #c0392b;
        }

        /* ==================== 主容器 ==================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ==================== 阶段显示区 ==================== */
        .phase-display {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #333;
            text-align: center;
        }

        .phase-display.main-phase {
            border-color: #c0392b;
        }

        .phase-display.search-phase {
            border-color: #27ae60;
        }

        .phase-display.waiting {
            border-color: #888;
        }

        .phase-display h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .phase-badge {
            display: inline-block;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .phase-badge.phase1 {
            background: rgba(41, 128, 185, 0.2);
            border: 2px solid #2980b9;
            color: #2980b9;
        }

        .phase-badge.phase2 {
            background: rgba(39, 174, 96, 0.2);
            border: 2px solid #27ae60;
            color: #27ae60;
        }

        .phase-badge.phase3 {
            background: rgba(212, 172, 13, 0.2);
            border: 2px solid #d4ac0d;
            color: #d4ac0d;
        }

        .phase-badge.phase4 {
            background: rgba(39, 174, 96, 0.2);
            border: 2px solid #27ae60;
            color: #27ae60;
        }

        .phase-badge.phase5 {
            background: rgba(192, 57, 43, 0.2);
            border: 2px solid #c0392b;
            color: #c0392b;
        }

        .phase-badge.phase6 {
            background: rgba(39, 174, 96, 0.2);
            border: 2px solid #27ae60;
            color: #27ae60;
        }

        .phase-badge.waiting {
            background: rgba(136, 136, 136, 0.2);
            border: 2px solid #888;
            color: #888;
        }

        .phase-type-label {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .phase-type-label.main {
            background: rgba(192, 57, 43, 0.2);
            color: #c0392b;
            border: 1px solid #c0392b;
        }

        .phase-type-label.search {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
            border: 1px solid #27ae60;
        }

        /* ==================== 地点列表 ==================== */
        .locations-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            color: #c0392b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c0392b;
        }

        .locations-section.search-active .section-title {
            color: #27ae60;
            border-bottom-color: #27ae60;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .location-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .location-card:hover {
            transform: translateY(-5px);
            border-color: #27ae60;
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.3);
        }

        .location-card.searched {
            border-color: #27ae60;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .location-card.searched:hover {
            transform: none;
            box-shadow: none;
        }

        .location-card.searched::after {
            content: "已搜索";
            position: absolute;
            top: 10px;
            right: 10px;
            background: #27ae60;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .location-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .location-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .location-desc {
            font-size: 0.85rem;
            color: #888;
        }

        /* ==================== 搜索动画弹窗 ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border: 2px solid #27ae60;
            position: relative;
            animation: modalPop 0.4s ease;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #c0392b;
        }

        .modal-title {
            font-size: 1.3rem;
            color: #27ae60;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        /* 搜索动画 */
        .search-animation {
            text-align: center;
            padding: 40px 20px;
        }

        .search-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: #27ae60;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-text {
            color: #27ae60;
            font-size: 1.1rem;
        }

        /* 线索结果 */
        .clue-result {
            display: none;
        }

        .clue-result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clue-result-id {
            font-size: 1.2rem;
            color: #c0392b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .clue-result-content {
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .clue-result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #c0392b;
            color: #fff;
        }

        .btn-primary:hover {
            background: #a93226;
        }

        .btn-success {
            background: #27ae60;
            color: #fff;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-secondary {
            background: #16213e;
            color: #888;
            border: 1px solid #333;
        }

        .btn-secondary:hover {
            background: #333;
        }

        /* ==================== 我的线索记录 ==================== */
        .my-clues-section {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .my-clues-section h2 {
            color: #c0392b;
            margin-bottom: 20px;
        }

        .clue-round-group {
            margin-bottom: 20px;
        }

        .clue-round-title {
            font-size: 1rem;
            color: #888;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        .my-clues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .my-clue-card {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #c0392b;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .my-clue-card:hover {
            transform: translateX(5px);
        }

        .my-clue-card.collapsed .my-clue-content {
            display: none;
        }

        .my-clue-id {
            font-size: 0.85rem;
            color: #c0392b;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .my-clue-location {
            font-size: 0.8rem;
            color: #27ae60;
            margin-bottom: 5px;
        }

        .my-clue-content {
            font-size: 0.95rem;
            color: #ccc;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }

        .no-clues {
            text-align: center;
            color: #555;
            padding: 40px;
            font-style: italic;
        }

        /* ==================== 提示信息 ==================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==================== 等待提示 ==================== */
        .waiting-message {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .waiting-message h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #c0392b;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 768px) {
            .locations-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>

    <!-- 头部 -->
    <header class="header">

    <!-- 主内容 -->

        <div class="phase-display waiting" id="phaseDisplay">
            <h2>当前游戏阶段</h2>
            <div class="phase-type-label" id="phaseTypeLabel">等待中</div>
            <div class="phase-badge waiting" id="phaseBadge">等待开始</div>
            <p style="color: #888; margin-top: 10px;" id="phaseDesc">请等待DM开始游戏</p>
        </div>

        <!-- 可搜索地点 -->
        <div class="locations-section" id="locationsSection">

    <!-- 线索弹窗 -->
    <div class="modal-overlay" id="clueModal">

            <!-- 搜索动画 -->

            </div>

            <!-- 线索结果 -->
            <div class="clue-result" id="clueResult">
                <div class="clue-result-id" id="resultClueId">线索编号</div>
                <div class="clue-result-content" id="resultClueContent">线索内容</div>
                <div class="clue-result-actions">
                    <button class="btn btn-success" onclick="recordClue()">记录线索</button>
                    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>

        // ==================== 当前玩家角色 ====================
        function getCurrentRole() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('role') || localStorage.getItem('currentRole') || 'shenmingxuan';

        // ==================== 获取当前搜证轮次的数据 ====================
        function getCurrentRoundData(phase) {
            if (phase === 2) return { round: 1, clues: round1Clues, locations: Object.keys(round1Clues) };
            if (phase === 4) return { round: 2, clues: round2Clues, locations: Object.keys(round2Clues) };

        function updatePhaseDisplay() {

            const phaseInfo = {
                0: { text: '等待开始', class: 'waiting', desc: '请等待DM开始游戏', type: '等待中', typeClass: '', isSearch: false },
                1: { text: '第一阶段', class: 'phase1', desc: '请阅读蓝色剧本（角色页面）', type: '主阶段', typeClass: 'main', isSearch: false },
                2: { text: '第一轮搜证', class: 'phase2', desc: '可搜索3个地点：客厅、餐厅、厨房', type: '搜证阶段', typeClass: 'search', isSearch: true },
                3: { text: '第二阶段', class: 'phase3', desc: '请阅读黄色剧本（角色页面）', type: '主阶段', typeClass: 'main', isSearch: false },
                4: { text: '第二轮搜证', class: 'phase4', desc: '可搜索5个地点：书房、主卧、次卧A、次卧B、管家房', type: '搜证阶段', typeClass: 'search', isSearch: true },
                5: { text: '第三阶段', class: 'phase5', desc: '请阅读红色剧本（角色页面）', type: '主阶段', typeClass: 'main', isSearch: false },
                6: { text: '第三轮搜证', class: 'phase6', desc: '可搜索6个地点：客房A、客房B、客房C、储藏室、露台、书房（再次）', type: '搜证阶段', typeClass: 'search', isSearch: true }
            };

            const info = phaseInfo[currentPhase] || phaseInfo[0];
            badge.textContent = info.text;
            badge.className = 'phase-badge ' + info.class;
            desc.textContent = info.desc;
            typeLabel.textContent = info.type;
            typeLabel.className = 'phase-type-label ' + info.typeClass;

            // 更新阶段显示框的边框颜色
            phaseDisplay.className = 'phase-display ' + (info.typeClass === 'search' ? 'search-phase' : info.typeClass === 'main' ? 'main-phase' : 'waiting');

            // 更新地点区域的主题色
            if (info.isSearch) {
                locationsSection.classList.add('search-active');
            } else {
                locationsSection.classList.remove('search-active');
            }

            // 更新可搜索地点
            updateLocations(currentPhase);
        }

        // ==================== 更新地点列表 ====================
        function updateLocations(phase) {
            const grid = document.getElementById('locationsGrid');
            const roundData = getCurrentRoundData(phase);

            // 如果不是搜证阶段，显示等待信息
            if (!roundData) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">当前不是搜证阶段，请等待DM开启搜证</div>';
                return;
            }

            // 获取已搜索的地点（按轮次存储）
            const searchedKey = 'searchedLocations_round' + roundData.round;
            const searchedLocations = JSON.parse(localStorage.getItem(searchedKey) || '[]');

            grid.innerHTML = roundData.locations.map(loc => {
                const isSearched = searchedLocations.includes(loc);
                return `
                    <div class="location-card ${isSearched ? 'searched' : ''}" ${!isSearched ? `onclick="searchLocation('${loc}')"` : ''}>
                        <div class="location-icon">${locationIcons[loc] || '\uD83D\uDCCD'}</div>
                        <div class="location-name">${loc}</div>
                        <div class="location-desc">${isSearched ? '已搜索完毕' : '点击搜索线索'}</div>
                    </div>
                `;
            }).join('');
        }

        // ==================== 当前弹窗相关的线索数据 ====================
        let currentModalClue = null;
        let currentModalLocation = '';

        // ==================== 搜索地点 ====================
        function searchLocation(locationName) {
            const currentPhase = parseInt(localStorage.getItem('currentPhase') || '0');
            const roundData = getCurrentRoundData(currentPhase);
            if (!roundData) return;

            // 检查是否已经搜索过
            const searchedKey = 'searchedLocations_round' + roundData.round;
            const searchedLocations = JSON.parse(localStorage.getItem(searchedKey) || '[]');
            if (searchedLocations.includes(locationName)) {
                showToast('该地点已经搜索过了');
                return;
            }

            // 打开弹窗
            const modal = document.getElementById('clueModal');
            const animation = document.getElementById('searchAnimation');
            const result = document.getElementById('clueResult');
            const modalTitle = document.getElementById('modalTitle');

            modalTitle.textContent = locationName + ' - 搜索中';
            animation.style.display = 'block';
            result.classList.remove('show');
            modal.classList.add('active');

            currentModalLocation = locationName;

            // 模拟搜索延迟（1.5秒）
            setTimeout(() => {
                // 从该地点的线索池中随机选择一条
                const clues = roundData.clues[locationName];
                const randomClue = clues[Math.floor(Math.random() * clues.length)];
                currentModalClue = randomClue;

                // 显示结果
                animation.style.display = 'none';
                document.getElementById('resultClueId').textContent = randomClue.id;
                document.getElementById('resultClueContent').textContent = randomClue.content;
                result.classList.add('show');
                modalTitle.textContent = locationName + ' - 发现线索！';

                // 标记为已搜索
                if (!searchedLocations.includes(locationName)) {
                    searchedLocations.push(locationName);
                    localStorage.setItem(searchedKey, JSON.stringify(searchedLocations));
                }

                // 记录该地点发放的线索（按轮次）
                const distributedKey = 'distributedClues_round' + roundData.round;
                const distributedClues = JSON.parse(localStorage.getItem(distributedKey) || '[]');
                if (!distributedClues.some(c => c.id === randomClue.id)) {
                    distributedClues.push({ id: randomClue.id, content: randomClue.content, location: locationName });
                    localStorage.setItem(distributedKey, JSON.stringify(distributedClues));
                }

                // 更新地点显示
                updateLocations(currentPhase);
            }, 1500);
        }

        // ==================== 关闭弹窗 ====================
        function closeModal() {
            document.getElementById('clueModal').classList.remove('active');
            currentModalClue = null;
            currentModalLocation = '';
        }

        // ==================== 记录线索 ====================
        function recordClue() {
            if (!currentModalClue) return;

            const currentRole = getCurrentRole();
            const myClues = JSON.parse(localStorage.getItem('playerClues_' + currentRole) || '[]');

            // 检查是否已记录
            if (myClues.some(c => c.id === currentModalClue.id)) {
                showToast('该线索已记录');
                closeModal();
                return;
            }

            // 记录线索，包含轮次信息
            const currentPhase = parseInt(localStorage.getItem('currentPhase') || '0');
            const roundNum = currentPhase === 2 ? 1 : currentPhase === 4 ? 2 : 3;
            myClues.push({
                id: currentModalClue.id,
                content: currentModalClue.content,
                location: currentModalLocation,
                round: roundNum
            });
            localStorage.setItem('playerClues_' + currentRole, JSON.stringify(myClues));

            showToast('线索已记录！');
            closeModal();
            loadMyClues();
        }

        // ==================== 加载我的线索 ====================
        function loadMyClues() {
            const currentRole = getCurrentRole();
            const myClues = JSON.parse(localStorage.getItem('playerClues_' + currentRole) || '[]');
            const container = document.getElementById('myClues');

            if (myClues.length === 0) {
                container.innerHTML = '<div class="no-clues">暂无记录的线索，点击地点进行搜索</div>';
                return;
            }

            // 按轮次分组
            const grouped = { 1: [], 2: [], 3: [] };
            myClues.forEach(clue => {
                const round = clue.round || 1;
                if (!grouped[round]) grouped[round] = [];
                grouped[round].push(clue);
            });

            let html = '';
            const roundNames = { 1: '第一轮搜证', 2: '第二轮搜证', 3: '第三轮搜证' };

            for (let r = 1; r <= 3; r++) {
                if (grouped[r] && grouped[r].length > 0) {
                    html += `
                        <div class="clue-round-group">
                            <div class="clue-round-title">${roundNames[r]} (${grouped[r].length}条)</div>
                            <div class="my-clues-grid">
                                ${grouped[r].map(clue => `
                                    <div class="my-clue-card collapsed" onclick="this.classList.toggle('collapsed')">
                                        <div class="my-clue-id">${clue.id}</div>
                                        <div class="my-clue-location">发现地点：${clue.location || '未知'}</div>
                                        <div class="my-clue-content">${clue.content}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html;
        }

        // ==================== 显示提示 ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ==================== 点击遮罩关闭弹窗 ====================
        document.getElementById('clueModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ==================== 初始化 ====================
        updatePhaseDisplay();
        loadMyClues();

        // 监听阶段变化
        window.addEventListener('storage', function(e) {
            if (e.key === 'currentPhase') {
                updatePhaseDisplay();
            }
            if (e.key.startsWith('playerClues_')) {
                loadMyClues();
            }
        });

        // 定时检查
        setInterval(updatePhaseDisplay, 3000);
    </script>
</body>
</html>
